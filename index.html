let guideI=-1;
function guideEl(){ let g=document.getElementById('guide'); if(!g){ g=document.createElement('div'); g.id='guide'; g.innerHTML='<div class="guide-spot"></div><div class="guide-card" role="dialog" aria-live="polite"></div>'; document.body.appendChild(g); } return g; }
function startGuide(){ guideI=0; guideStep(); }
function endGuide(){ guideI=-1; const g=document.getElementById('guide'); if(g) g.remove(); State.guideDone=true; save(); const f=document.querySelector('.guide-fab'); if(f) f.classList.remove('hidden'); }
function guideStep(){ if(guideI<0||guideI>=GUIDE.length){ endGuide(); return; } const st=GUIDE[guideI]; if(currentPage()!==st.page){ location.hash=st.page; } setTimeout(placeGuide,80); }
function placeGuide(){ if(guideI<0) return; const st=GUIDE[guideI]; const g=guideEl(); const spot=g.querySelector('.guide-spot'), card=g.querySelector('.guide-card'); let el=document.querySelector(st.sel); const main=document.querySelector('main');
  if(el&&el.scrollIntoView){ el.scrollIntoView({block:'nearest',behavior:'instant'}); }
  const r=el?el.getBoundingClientRect():{left:0,top:0,width:0,height:0}; const pad=10;
  if(el&&r.width){ spot.style.display='block'; spot.style.left=(r.left-pad)+'px'; spot.style.top=(r.top-pad)+'px'; spot.style.width=(r.width+2*pad)+'px'; spot.style.height=(r.height+2*pad)+'px'; } else spot.style.display='none';
  card.innerHTML=`<div class="gk">Guide · ${guideI+1} of ${GUIDE.length}</div><h4>${esc(st.t)}</h4><p>${esc(st.d)}</p><div class="row between"><button class="btn sm" data-action="guideskip">Skip tour</button><span><button class="btn sm" data-action="guideback" ${guideI===0?'disabled':''}>Back</button><button class="btn primary sm" data-action="guidenext">${guideI===GUIDE.length-1?'Finish':'Next'}</button></span></div>`;
  const vw=window.innerWidth||1200, vh=window.innerHeight||800; const cw=Math.min(380,vw-32); card.style.width=cw+'px';
  let left=r.left+r.width+20, top=r.top; if(!el||!r.width){ left=(vw-cw)/2; top=vh*0.3; }
  if(left+cw>vw-16) left=Math.max(16,r.left-cw-20); if(left<16||(el&&r.width>vw*0.6)){ left=Math.max(16,Math.min(vw-cw-16,r.left)); top=r.top+r.height+20; }
  if(top+260>vh) top=Math.max(16,vh-280); if(top<16) top=16; card.style.left=left+'px'; card.style.top=top+'px'; }
ACTIONS.guide=()=>{ const f=document.querySelector('.guide-fab'); if(f) f.classList.add('hidden'); startGuide(); };
ACTIONS.guidenext=()=>{ guideI++; guideStep(); }; ACTIONS.guideback=()=>{ guideI=Math.max(0,guideI-1); guideStep(); }; ACTIONS.guideskip=()=>endGuide();
window.addEventListener('resize',()=>{ if(guideI>=0) placeGuide(); });
document.addEventListener('scroll',()=>{ if(guideI>=0) placeGuide(); },true);
(function(){ const f=document.createElement('button'); f.className='guide-fab'; f.dataset.action='guide'; f.setAttribute('aria-label','Open the guided tour'); f.innerHTML='<span class="q">?</span> Guide me'; document.body.appendChild(f); if(!State.guideDone) setTimeout(()=>{ f.classList.add('hidden'); startGuide(); },2000); })();

/* ---------- Premium motion layer (no libraries) ---------- */
(function(){
  const reduce=window.matchMedia('(prefers-reduced-motion: reduce)');
  const main=document.querySelector('main');
  const bar=document.createElement('div'); bar.className='scroll-progress'; document.body.appendChild(bar);
  let ticking=false;
  const onScroll=()=>{ if(ticking) return; ticking=true; requestAnimationFrame(()=>{
    const st=main.scrollTop, max=main.scrollHeight-main.clientHeight;
    bar.style.transform='scaleX('+(max>0?Math.min(1,st/max):0)+')';
    if(!reduce.matches) document.documentElement.style.setProperty('--py',st);
    const top=document.querySelector('.top'); if(top) top.classList.toggle('scrolled',st>6);
    ticking=false; }); };
  main.addEventListener('scroll',onScroll,{passive:true});

  /* scroll-triggered reveal: only panels / tiles that are not direct children of the page (those use the entrance animation) */
  let io=null;
  window.astraReveal=function(root){
    if(reduce.matches||!('IntersectionObserver' in window)) return;
    if(!io) io=new IntersectionObserver(es=>{ es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } }); },{root:main,threshold:.06,rootMargin:'0px 0px -5% 0px'});
    root.querySelectorAll('.panel,.kpi').forEach(el=>{
      if(el.parentElement&&el.parentElement.classList.contains('page')) return;
      const sibs=[...el.parentElement.children]; const i=Math.min(5,sibs.indexOf(el));
      el.style.transitionDelay=(i*70)+'ms'; el.classList.add('rv'); io.observe(el);
    });
  };

  /* animated navigation indicator (FLIP between renders) */
  let prevY=null;
  function navIndicator(){
    const nav=document.querySelector('.nav'); if(!nav) return;
    const act=nav.querySelector('a.active'); if(!act||!act.offsetParent) return;
    const ind=document.createElement('span'); ind.className='nav-ind'; nav.appendChild(ind);
    const y=Math.round(act.getBoundingClientRect().top-nav.getBoundingClientRect().top+nav.scrollTop), h=act.offsetHeight; ind.style.height=h+'px';
    if(prevY!=null&&!reduce.matches){ ind.style.transform='translateY('+prevY+'px)'; void ind.offsetHeight; ind.classList.add('go'); requestAnimationFrame(()=>{ ind.style.transform='translateY('+y+'px)'; }); }
    else ind.style.transform='translateY('+y+'px)';
    prevY=y;
  }
  const _shell=renderShell; renderShell=function(){ _shell(); navIndicator(); };
  const _page=renderPage; renderPage=function(){ _page(); const m=document.querySelector('main'); const pg=m.querySelector('.page'); if(pg) pg.classList.add('enter'); astraReveal(m); onScroll(); };
})();

/* ---------- Command rail: jump palette + collapsed-rail tooltips ---------- */
(function(){
  const flat=[]; NAV.forEach(g=>g.items.forEach(it=>flat.push({id:it[0],t:it[1],d:it[2],g:g.g})));
  const pal=document.createElement('div'); pal.id='palette'; pal.setAttribute('role','dialog'); pal.setAttribute('aria-modal','true'); pal.setAttribute('aria-label','Jump to page');
  pal.innerHTML='<div class="pal"><div class="pal-in">'+icon('M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM21 21l-5-5')+'<input id="pal-q" type="text" placeholder="Jump to a page or action…" autocomplete="off" spellcheck="false" aria-label="Search pages and actions"><span class="kbd">Esc</span></div><div class="pal-list" id="pal-list" role="listbox"></div><div class="pal-foot"><span>↑↓ Navigate</span><span>↵ Open</span><span>Esc Close</span></div></div>';
  document.body.appendChild(pal);
  const list=pal.querySelector('#pal-list'), q=pal.querySelector('#pal-q'); let sel=0, items=[], prev=null;
  function build(){
    const toks=q.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
    const acts=[{t:State.collapsed?'Expand sidebar':'Collapse sidebar',g:'Action',d:'M3 5h18v14H3zM9 5v14',run:()=>ACTIONS['collapse-toggle']()}];
    if(typeof startGuide==='function') acts.push({t:'Start guided tour',g:'Action',d:'M12 17v.01M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 1-1 1.7M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z',run:()=>startGuide()});
    items=flat.map(x=>({...x,run:()=>{ location.hash=x.id; }})).concat(acts).filter(x=>toks.every(k=>(x.t+' '+x.g+' '+(x.id||'')).toLowerCase().includes(k)));
    if(sel>=items.length) sel=0;
    list.innerHTML=items.length?items.map((x,i)=>'<button class="pal-item'+(i===sel?' on':'')+'" role="option" data-i="'+i+'"><span class="ni">'+icon(x.d)+'</span><span>'+esc(x.t)+'</span><span class="g">'+esc(x.g)+'</span></button>').join(''):'<div class="pal-empty">No matching pages</div>';
  }
  function mark(){ list.querySelectorAll('.pal-item').forEach((b,i)=>{ b.classList.toggle('on',i===sel); if(i===sel) b.scrollIntoView({block:'nearest'}); }); }
  function open(){ prev=document.activeElement; q.value=''; sel=0; build(); pal.classList.add('open'); q.focus(); }
  function close(){ pal.classList.remove('open'); if(prev&&prev.focus) try{ prev.focus(); }catch(e){} }
  function run(i){ const it=items[i]; if(!it) return; close(); it.run(); }
  q.addEventListener('input',()=>{ sel=0; build(); });
  q.addEventListener('keydown',e=>{
    if(e.key==='ArrowDown'){ e.preventDefault(); if(items.length){ sel=(sel+1)%items.length; mark(); } }
    else if(e.key==='ArrowUp'){ e.preventDefault(); if(items.length){ sel=(sel-1+items.length)%items.length; mark(); } }
    else if(e.key==='Enter'){ e.preventDefault(); run(sel); }
    else if(e.key==='Escape'){ e.preventDefault(); close(); }
  });
  list.addEventListener('mousemove',e=>{ const b=e.target.closest('.pal-item'); if(b&&+b.dataset.i!==sel){ sel=+b.dataset.i; mark(); } });
  list.addEventListener('click',e=>{ const b=e.target.closest('.pal-item'); if(b) run(+b.dataset.i); });
  pal.addEventListener('mousedown',e=>{ if(e.target===pal) close(); });
  document.addEventListener('keydown',e=>{
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); pal.classList.contains('open')?close():open(); return; }
    if(e.key==='/'&&!pal.classList.contains('open')&&!/^(INPUT|TEXTAREA|SELECT)$/.test((e.target.tagName||''))&&!e.target.isContentEditable&&!e.ctrlKey&&!e.metaKey&&!e.altKey){ e.preventDefault(); open(); }
  });
  ACTIONS.palette=open;

  /* tooltips for the icon-only rail */
  const tip=document.createElement('div'); tip.className='rail-tip'; document.body.appendChild(tip);
  const railOn=()=>document.getElementById('app').classList.contains('collapsed')||matchMedia('(max-width:900px)').matches;
  function showTip(el){ if(!railOn()) return; const r=el.getBoundingClientRect(); tip.textContent=el.dataset.tip; tip.style.left=(r.right+10)+'px'; tip.style.top=(r.top+r.height/2)+'px'; tip.classList.add('show'); }
  document.addEventListener('mouseover',e=>{ const el=e.target.closest&&e.target.closest('.side [data-tip]'); if(el) showTip(el); });
  document.addEventListener('mouseout',e=>{ if(e.target.closest&&e.target.closest('.side [data-tip]')) tip.classList.remove('show'); });
  document.addEventListener('focusin',e=>{ const el=e.target.closest&&e.target.closest('.side [data-tip]'); if(el) showTip(el); });
  document.addEventListener('focusout',()=>tip.classList.remove('show'));
  document.addEventListener('click',()=>tip.classList.remove('show'));
})();

ACTIONS.bmlayer=function(el){ const box=el.closest('.bodymap'); if(!box) return; UI.bmLayer=el.dataset.layer; box.dataset.layer=el.dataset.layer; box.querySelectorAll('.bm-chips .chip').forEach(b=>b.classList.toggle('on',b===el)); };
/* ---------- Simulated telemetry preview (current moment only; history and analytics stay deterministic) ---------- */
const LIVE_CH=[
  {k:'hr',   label:'Heart rate', unit:'bpm',   dec:0, amp:5,   src:(a,mi)=>{ const p=lastPoint(a,'rhr');  return p?p.value+13:null; }},
  {k:'spo2', label:'SpO₂',       unit:'%',     dec:0, amp:.55, src:(a,mi)=>{ const p=lastPoint(a,'spo2'); return p?p.value:null; }},
  {k:'rr',   label:'Resp. rate', unit:'/min',  dec:0, amp:1,   src:(a,mi)=>{ const p=lastPoint(a,'rr');   return p?p.value:null; }},
  {k:'temp', label:'Body temp',  unit:'°C',    dec:1, amp:.12, src:(a,mi)=>{ const p=lastPoint(a,'temp'); return p?p.value:null; }},
  {k:'co2',  label:'Cabin CO₂',  unit:'mmHg',  dec:2, amp:.04, src:(a,mi)=>{ const v=genEnv(mi).co2[mi.currentDay]; return v==null?null:v; }},
  {k:'rad',  label:'Radiation',  unit:'µSv/h', dec:1, rel:.03, src:(a,mi)=>{ const v=genEnv(mi).rad[mi.currentDay]; return v==null?null:v*1000/24; }}
];
function liveVal(k,c,amp,t,seed){
  const s=(p,T)=>Math.sin(2*Math.PI*t/T+p);
  const n=.55*s(seed,83)+.3*s(seed*1.7,29)+.15*s(seed*2.3,9.5);
  const h=Math.sin(Math.floor(t)*12.9898+seed*78.233)*43758.5453; const jit=(h-Math.floor(h))-.5;
  let v=c+amp*n+amp*.35*jit;
  if(k==='hr') v+=1.1*Math.sin(2*Math.PI*t/4.6+seed); /* respiratory sinus arrhythmia */
  if(k==='spo2') v=Math.min(100,v);
  return v;
}
function liveStrip(a,mission){
  const paused=mission.currentDay<baseMission(mission.id).currentDay;
  const tiles=LIVE_CH.map(ch=>{ const c=paused?null:ch.src(a,mission); const amp=ch.rel&&c!=null?c*ch.rel:ch.amp; const seed=(hashStr(a.id+ch.k)%628)/100;
    return `<div class="lt" data-k="${ch.k}" data-c="${c==null?'':c}" data-amp="${amp}" data-dec="${ch.dec}" data-seed="${seed}"><span class="lk">${ch.label}</span><span class="lv"><b>—</b><small>${ch.unit}</small></span><svg class="ls" viewBox="0 0 100 24" preserveAspectRatio="none" aria-hidden="true"><polyline points=""/></svg></div>`; }).join('');
  return `<section class="live ${paused?'paused':''}" id="live-strip" aria-label="Simulated telemetry preview"><div class="live-head"><span class="live-dot"></span><b>Simulated telemetry preview</b>${prov('sim')}<span class="live-sub">${paused?'Paused while replaying day '+mission.currentDay:'Illustrative stream · refreshes every second'}</span></div><div class="live-grid">${tiles}</div>
  ${note('Simulated telemetry preview streams the current moment, centred on today’s recorded value for this crew member. It does not feed the baseline analytics, so statuses and trends stay stable and reproducible; those update when a new day’s measurements arrive.')}</section>`;
}
(function(){
  const reduce=window.matchMedia('(prefers-reduced-motion: reduce)'); const N=60;
  function tick(){
    if(document.hidden) return; const strip=document.getElementById('live-strip'); if(!strip||strip.classList.contains('paused')) return;
    const t=Math.floor(Date.now()/1000);
    strip.querySelectorAll('.lt').forEach(el=>{
      if(el.dataset.c==='') return; const c=+el.dataset.c, amp=+el.dataset.amp, dec=+el.dataset.dec, seed=+el.dataset.seed, k=el.dataset.k;
      el.querySelector('b').textContent=liveVal(k,c,amp,t,seed).toFixed(dec);
      const lo=c-amp*1.5, span=amp*3; let pts='';
      for(let i=N-1;i>=0;i--){ const v=liveVal(k,c,amp,t-i,seed); pts+=((N-1-i)/(N-1)*100).toFixed(1)+','+(22-Math.max(0,Math.min(1,(v-lo)/span))*20).toFixed(1)+' '; }
      el.querySelector('polyline').setAttribute('points',pts);
    });
  }
  const _rp=renderPage; renderPage=function(){ _rp(); tick(); };
  const _rk=rerenderPageKeepScroll; rerenderPageKeepScroll=function(){ _rk(); tick(); };
  setInterval(tick,reduce.matches?5000:1000);
})();


render();
