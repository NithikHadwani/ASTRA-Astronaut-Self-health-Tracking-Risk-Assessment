    indicators:[`Headache ${fmt(hd.value,'headache')}/10 (3-day mean)`,`Cabin CO₂ 7-day mean ${co2w.toFixed(2)} mmHg`],explanation:'Headache reports rise with cabin CO₂ in published ISS data. Correlation with the current CO₂ excursion is suggestive, not proof; sleep, hydration and workload are concurrent candidates.',
    assess:['Headache diary with CO₂ cross-check (Hazards → correlation)','BP and SpO₂ check'],counter:['ECLSS scrubber status review','Record fluid intake','Medical officer review under the approved procedure'],escalate:'Red-flag headache features → Level 1.'});
  return P.sort((x,y)=>ORDER[y.status]-ORDER[x.status]);
}

/* ---------- Exposure-to-health correlation ---------- */
function workloadSeries(mission){ const D=mission.currentDay; const w=new Array(D+1).fill(0); for(const e of mission.schedule) if(e.type==='work'||e.type==='eva') for(let d=e.day;d<=e.day+(e.span||0);d++) if(d<=D) w[d]=1; return w; }
function pearson(x,y){ const n=x.length; if(n<6) return {r:0,n}; const mx=mean(x),my=mean(y); let a=0,b=0,c=0; for(let i=0;i<n;i++){ a+=(x[i]-mx)*(y[i]-my); b+=(x[i]-mx)**2; c+=(y[i]-my)**2; } const r=b&&c?a/Math.sqrt(b*c):0; const t=Math.abs(r)*Math.sqrt((n-2)/Math.max(1e-9,1-r*r)); return {r,n,t}; }
function correlate(a,target,window=30){
  const mission=getMission(a.mission); const D=mission.currentDay; const env=genEnv(mission); const tg=seriesFor(a,target).vals; const wl=workloadSeries(mission);
  const cands=[...Object.keys(ENV).map(k=>({id:k,label:ENV[k].label,src:env[k],kind:'env'})),{id:'workload',label:'Scheduled high workload',src:wl,kind:'mission'},
    ...['sleep','stress','hydration','rhr','exercise'].filter(m=>m!==target).map(m=>({id:m,label:METRICS[m].label,src:seriesFor(a,m).vals,kind:'health'}))];
  const out=[];
  for(const c of cands){
    let best=null;
    for(const lag of [0,1]){ const xs=[],ys=[]; for(let d=Math.max(2,D-window+1);d<=D;d++){ const x=c.src[d-lag],y=tg[d]; if(x!=null&&y!=null){ xs.push(x); ys.push(y);} }
      if(sd(xs)===0||sd(ys)===0) continue; const p=pearson(xs,ys); if(!best||Math.abs(p.r)>Math.abs(best.r)) best={...p,lag}; }
    if(best) out.push({...c,...best,strength:Math.abs(best.r)>=.6?'strong':Math.abs(best.r)>=.35?'moderate':'weak',sig:best.t>2.05});
  }
  /* crew-wide concurrent reports for the same symptom */
  const others=crewOf(a.mission).filter(o=>o.id!==a.id).map(o=>({name:o.name,val:mean(windowVals(o,target,D-6,D))})).filter(o=>o.val!=null&&o.val>=2);
  return {rows:out.sort((x,y)=>Math.abs(y.r)-Math.abs(x.r)),crew:others,window};
}

/* ---------- Forecast: linear extrapolation with widening band ---------- */
function forecast(a,m,horizon=14,window=14){
  const t=trend(a,m,window); const {vals,D}=seriesFor(a,m); if(t.status==='na') return null; const last=vals.slice().reverse().find(v=>v!=null);
  const pts=[]; for(let k=1;k<=horizon;k++){ const day=D+k; const y=t.intercept+t.slope*day; const band=Math.max(t.resid,a.baseline[m].sd*.5)*Math.sqrt(1+k/window)*1.3; pts.push({day,y,lo:y-band,hi:y+band}); }
  return {points:pts,slope:t.slope,n:t.n,last};
}

/* ---------- Scenario simulator (simplified evidence-informed model) ---------- */
const SIM_ASSUMPTIONS=['Each hour of sleep below your baseline adds ~0.12 bpm/day to resting HR and removes ~0.5 ms/day of HRV until recovery (sleep-restriction literature; simplified).','Each missed share of exercise reduces exercise output ~0.3%/day and raises CTX ~0.0015 ng/mL/day (unloading studies; simplified).','Energy/protein shortfall slows strength recovery and adds to CTX rise.','Workload above normal adds stress and subtracts from mood and sleep quality.','All indicators drift back toward personal baseline at 6%/day when drivers are removed.','Bands show ±1 SD of model noise widening with time; they are not clinical confidence intervals.'];
function simulate(a,p,horizon=30){
  const b=a.baseline; const cur={}; for(const m of ['rhr','hrv','exercise','ctx','mood','sleepq']){ const d=deviation(a,m); cur[m]=d.value!=null?d.value:b[m].mean; }
  const def=Math.max(0,b.sleep.mean-p.sleep), gap=1-p.adherence, nut=1-p.nutrition, wl=p.workload-1, rec=p.recovery?1:0;
  const out={rhr:[],hrv:[],exercise:[],ctx:[],mood:[],sleepq:[]}; let s={...cur};
  for(let k=1;k<=horizon;k++){
    s.rhr += .12*def + .9*gap*.1 + .15*wl - .1*rec + (b.rhr.mean-s.rhr)*.06;
    s.hrv += -.5*def - .35*gap - .4*wl + .3*rec + (b.hrv.mean-s.hrv)*.06;
    s.exercise += -.3*gap*1.5 - .08*def - .05*nut*2 + .12*rec + (b.exercise.mean*(1-.25*gap)-s.exercise)*.06;
    s.ctx += .0015*gap + .001*nut + (b.ctx.mean*(1+.5*gap)-s.ctx)*.02;
    s.mood += -.03*def - .04*wl - .01*nut*2 + .03*rec + (b.mood.mean-s.mood)*.06;
    s.sleepq += -.05*def - .04*wl + .03*rec + (b.sleepq.mean-s.sleepq)*.06;
    for(const m in out){ const band=b[m].sd*.35*Math.sqrt(k/5); out[m].push({day:getMission(a.mission).currentDay+k,y:s[m],lo:s[m]-band,hi:s[m]+band}); }
  }
  return {traj:out,start:cur,assumptions:SIM_ASSUMPTIONS};
}

/* ---------- Deterministic triage ---------- */
function triage(sel,sev,vit){
  let level=4; const why=[]; const protos=new Set();
  for(const id of sel){ const s=SYMPTOMS.find(x=>x.id===id); if(!s) continue; protos.add(s.proto);
    let l=s.level||(s.redflag?2:(sev>=7?3:4)); if(s.redflag&&sev>=7) l=1; if(l<level) level=l; why.push(`${s.label}: ${s.redflag?'red-flag symptom':'non-urgent symptom'} → level ${l}`); }
  if(sel.includes('chestpain')&&sel.includes('sob')){ level=1; why.push('Chest pain with breathlessness → level 1'); }
  const v=vit||{};
  if(v.spo2!=null){ if(v.spo2<90){ level=1; why.push(`SpO₂ ${v.spo2}% < 90 → level 1`);} else if(v.spo2<94&&level>2){ level=2; why.push(`SpO₂ ${v.spo2}% < 94 → level 2`);} }
  if(v.sbp!=null&&v.sbp<90){ level=1; why.push(`Systolic BP ${v.sbp} < 90 → level 1`); }
  if(v.hr!=null&&(v.hr>130||v.hr<40)){ level=1; why.push(`Heart rate ${v.hr} outside 40–130 → level 1`); }
  if(v.temp!=null&&v.temp>39.5&&level>2){ level=2; why.push(`Temperature ${v.temp} °C > 39.5 → level 2`); }
  if(!sel.length&&Object.values(v).every(x=>x==null)) return {level:null,why:['Select at least one symptom or enter vital signs.'],protos:[]};
  const names={1:'Immediate — life threat',2:'Urgent — act within 30 min',3:'Prompt — assess today',4:'Routine — monitor'};
  return {level,label:names[level],why,protos:[...protos].sort((x,y)=>PROTOCOLS[x].urgency-PROTOCOLS[y].urgency)};
}
function inventoryCheck(ids){ return ids.map(id=>{ const it=INVENTORY.find(i=>i.id===id); const st=State.inventory[id]||{}; const qty=st.qty!=null?st.qty:it.qty; const status=st.status||it.status; return {id,name:it.name,qty,unit:it.unit,status,exp:it.exp,ok:qty>0&&status!=='failed'&&!expired(it.exp)}; }); }
function expired(exp){ return exp?exp<'2033-11':false; } /* demo "today" = Nov 2033 (fictional mission) */
function expSoon(exp){ return exp?exp<'2034-06':false; }

/* ---------- Countermeasure plan ---------- */
function buildPlan(a){
  const P=detectPatterns(a); const tasks=[]; const D=getMission(a.mission).currentDay; const add=(id,cat,t,d,why,eq)=>tasks.push({id,cat,t,d,why,eq:eq||[]});
  const ids=P.map(p=>p.id);
  if(ids.includes('recovery')){ add('rec-bp','Cardiovascular','Repeat seated resting HR and BP, morning and evening (3 days)','Sit restrained 10 min, then measure. Enter in Daily scan.','Confirms whether the resting HR rise is sustained and not measurement noise.',['bp']);
    add('rec-sleep','Sleep','Protect an 8-hour sleep opportunity tonight','Lights down at the scheduled time; no high-intensity tasks in the last 2 hours.','Sleep is the fastest lever on HRV, mood and reaction time.');
    add('rec-load','Exercise','Reduce resistive load 20% for 3 days, keep aerobic session','Maintain the stimulus while lowering total strain.','Falling exercise output under fatigue is a sign to recover, not to push.');
    add('rec-hyd','Hydration','Fluid target +0.5 L today','Spread intake across the shift.','Fluid intake has fallen below baseline alongside resting HR rise.',['ors']);
    add('rec-cog','Cognition','Repeat cognitive battery tomorrow morning','2-minute test in Mental & cognitive health.','Reaction time has slowed; a repeat separates a bad day from a trend.');
    add('rec-work','Workload','Request workload review with ground','Attach the ASTRA handoff report.','The pattern coincides with the high-workload campaign.'); }
  if(ids.includes('bone')){ add('bone-ex','Bone & muscle','Full high-load resistive session today','Squat, deadlift, heel raise per prescription.','Loading is the primary bone and muscle countermeasure.');
    add('bone-nut','Nutrition','Log energy and protein; confirm vitamin D taken','Target per nutrition plan.','Marker rise is amplified by energy deficit.');
    add('bone-sched','Scheduling','Move exercise before high-workload tasks for the next week','Prevents sessions being dropped.','Missed sessions cluster on busy days.'); }
  if(ids.includes('vestib')) add('vest-ex','Vestibular','15-minute sensorimotor exercise set','Gaze stabilisation and head-movement drills.','Supports balance and EVA readiness.');
  if(ids.includes('infection')){ add('inf-rest','Recovery','Suspend exercise until afebrile 24 h','Rest and fluids.','Exertion during infection prolongs recovery.'); add('inf-obs','Monitoring','Temperature and SpO₂ every 6 hours','Record in Daily scan.','Detects deterioration early.',['therm','oxim']); }
  if(ids.includes('sans')) add('sans-img','Ocular','Fundus imaging and queue to ground','Use fundus camera, both eyes.','Objective assessment of acuity shift.',['fundus']);
  if(ids.includes('co2')){ add('co2-eclss','Environment','Confirm CO₂ scrubber status with ECLSS','Check trend in Environmental monitoring.','Headache correlates with the CO₂ excursion.'); add('co2-diary','Symptoms','Keep headache diary for 5 days','Severity and time of day.','Needed to confirm or exclude the environmental link.'); }
  add('gen-ex','Exercise','Complete today’s scheduled exercise session','Per prescription.','Daily loading protects bone, muscle and cardiovascular fitness.');
  add('gen-hyd','Hydration','Reach daily fluid target','≥ 2.5 L unless advised otherwise.','Thirst is blunted in microgravity.');
  add('gen-scan','Monitoring','Complete the daily health scan','2–3 minutes.','Keeps the baseline comparison current.');
  const sched=missionAware(a); for(const r of sched.recs) add('ma-'+r.id,'Mission','' + r.t,r.d,r.why);
  return tasks.map(t=>({...t,done:!!(State.tasks[a.id]&&State.tasks[a.id][t.id]),inv:inventoryCheck(t.eq)}));
}
/* ---------- Response evaluation after countermeasures ---------- */
function evaluateResponse(a){
  const D=getMission(a.mission).currentDay; const P=detectPatterns(a); const ms=new Set(['rhr','hrv','sleepq','exercise','mood','fatigue']); if(P.some(p=>p.id==='infection')) ['temp','rr','spo2'].forEach(m=>ms.add(m));
  const rows=[]; for(const m of ms){ const recent=mean(windowVals(a,m,D-2,D)), prior=mean(windowVals(a,m,D-6,D-3)); if(recent==null||prior==null) continue; const diff=recent-prior; const bad=METRICS[m].bad; const adverse=bad==='high'?diff:bad==='low'?-diff:Math.abs(diff); const z=adverse/a.baseline[m].sd; rows.push({m,recent,prior,diff,verdict:z<-.4?'improving':z>.4?'worsening':'stable'}); }
  const done=Object.values(State.tasks[a.id]||{}).filter(Boolean).length;
  return {rows,done,summary:rows.length?(rows.filter(r=>r.verdict==='worsening').length>rows.filter(r=>r.verdict==='improving').length?'Indicators are still moving adversely — continue countermeasures and reassess in 48 h; escalate per pattern rules.':rows.some(r=>r.verdict==='improving')?'Some indicators are improving. Continue the plan and confirm with tomorrow’s scan.':'No clear change yet. The evaluation window is short; repeat after 2 more days of data.'):'Not enough data to evaluate.'};
}
/* ---------- Mission-aware intelligence ---------- */
function missionAware(a){
  const mission=getMission(a.mission); const D=mission.currentDay; const up=mission.schedule.filter(e=>e.day>D&&e.day<=D+14&&e.type!=='env').sort((x,y)=>x.day-y.day); const recs=[]; const ov=overall(a).status;
  for(const e of up){ const dd=e.day-D;
    if(e.type==='eva'&&e.label.includes(a.name.split(' ').pop())){ recs.push({id:'eva-pre',t:`Pre-EVA readiness check (EVA in ${dd} d)`,d:'Resting HR/BP, SpO₂, symptom screen, balance test, hydration review 24 h before.',why:'EVA is the highest-exertion, highest-risk activity scheduled.'}); if(ov==='warn'||ov==='crit') recs.push({id:'eva-flag',t:'Flag current health pattern to EVA planning',d:'Discuss whether to swap EVA crew or delay.',why:'Current indicators are outside your baseline.'}); recs.push({id:'eva-sleep',t:'Prioritise sleep in the 3 nights before EVA',d:'No late tasks; melatonin per protocol if needed.',why:'Sleep loss degrades EVA performance.'}); }
    else if(e.type==='eva') recs.push({id:'eva-support',t:`Support EVA (day ${e.day}): review suit-related medical checks`,d:'Confirm EVA medical kit and post-EVA assessment plan.',why:'IV crew prepares post-EVA monitoring.'});
    if(e.type==='comm') recs.push({id:'comm-prep',t:`Comm blackout in ${dd} d: prepare handoff report and confirm medical reserves`,d:'Generate the report in Earth communication and send before the window.',why:'No ground consult will be available during the window.'});
    if(e.type==='exam') recs.push({id:'exam-due',t:`Periodic medical exam in ${dd} d`,d:'Blood sample, acuity, sensorimotor battery, body mass.',why:'Keeps periodic markers (CTX, acuity) current.'});
    if(e.type==='work') recs.push({id:'work-prep',t:`High-workload period starts in ${dd} d`,d:'Front-load exercise and sleep; set hydration reminders.',why:'Workload periods are when countermeasures get dropped.'}); }
  const active=mission.schedule.filter(e=>e.span&&e.day<=D&&D<=e.day+e.span);
  return {up,active,recs,delay:mission.commDelayMin(D)};
}
/* ---------- Alerts ---------- */
function alerts(a){
  const A=[]; const mission=getMission(a.mission); const D=mission.currentDay;
  for(const p of detectPatterns(a)) A.push({s:p.status,t:p.title,d:`${p.explanation} ${p.indicators.slice(0,2).join(' · ')}`,src:'Pattern',page:'trends'});
  for(const m of METRIC_IDS){ const d=deviation(a,m); if(ORDER[d.status]>=ORDER.att) A.push({s:d.status,t:`${METRICS[m].label} ${d.status==='att'?'drifting from':'outside'} baseline`,d:`${fmt(d.value,m)} ${METRICS[m].unit} vs synthetic baseline ${fmt(d.mean,m)} ± ${fmt(d.sd,m)} (${d.z!=null?d.z.toFixed(1)+' SD':''}; ${d.n??1} observation(s), ${d.window||'latest value'}). Prototype rule: ≥1 SD = monitor, ≥2 SD = assess; reference-band breach may raise status.${d.clinical&&d.clinical!=='ok'?' Current value is also outside the prototype reference band.':''}`,src:'Baseline',page:'bodymap',sys:METRICS[m].sys}); }
  const env=genEnv(mission); for(const k in ENV){ const v=env[k][D],e=ENV[k]; const s=envStatus(k,v); if(ORDER[s]>=ORDER.att){ const band=e.bad==='both'?`ASTRA prototype preferred band ${e.lo[0]}–${e.lo[1]} ${e.unit}; critical outside ${e.crit[0]}–${e.crit[1]} ${e.unit}`:e.bad==='high'?`ASTRA prototype monitor band ≥${(e.warn*.85).toFixed(e.dec)} ${e.unit}; assess ≥${e.warn} ${e.unit}; critical ≥${e.crit} ${e.unit}`:`ASTRA prototype monitor band ≤${e.warn} ${e.unit}; critical ≤${e.crit} ${e.unit}`; A.push({s,t:`${e.label} ${v} ${e.unit}`,d:`${band}. Context: ${e.ref}`,src:'Environment',page:'environment'}); } }
  for(const it of INVENTORY){ if(expired(it.exp)) A.push({s:'warn',t:`${it.name} expired`,d:'Remove from active use; check reserve alternatives.',src:'Inventory',page:'inventory'}); else if(expSoon(it.exp)) A.push({s:'att',t:`${it.name} expires ${it.exp}`,d:'Plan substitution.',src:'Inventory',page:'inventory'}); if(it.status==='degraded') A.push({s:'att',t:`${it.name} degraded`,d:it.maint||'',src:'Inventory',page:'inventory'}); }
  for(const m of METRIC_IDS){ const def=METRICS[m]; if(def.period){ const lp=lastPoint(a,m); if(!lp||D-lp.day>def.period) A.push({s:'att',t:`${def.label} overdue`,d:`Last measured ${lp?'day '+lp.day:'never'}; ASTRA demo cadence ${def.period} days. Missing data is not normal data.`,src:'Schedule',page:'scan'}); } }
  return A.sort((x,y)=>ORDER[y.s]-ORDER[x.s]);
}
function envStatus(k,v){ const e=ENV[k]; if(v==null) return 'na'; if(e.bad==='both'){ if(v<e.crit[0]||v>e.crit[1]) return 'crit'; if(v<e.lo[0]||v>e.lo[1]) return 'warn'; return 'ok'; } if(e.bad==='high'){ if(v>=e.crit) return 'crit'; if(v>=e.warn) return 'warn'; if(v>=e.warn*.85) return 'att'; return 'ok'; } if(v<=e.crit) return 'crit'; if(v<=e.warn) return 'warn'; return 'ok'; }

/* ---------- Hazard exposure summaries ---------- */
function hazardExposure(a){
  const mission=getMission(a.mission); const D=mission.currentDay; const env=genEnv(mission); const cum=env.rad.slice(1,D+1).reduce((x,y)=>x+(y||0),0);
  const missed=(a.missed||[]).filter(d=>d>D-30).length; const adherence=Math.round(100*(30-missed)/30);
  const mood=deviation(a,'mood'),stress=deviation(a,'stress');
  const cached=Object.keys(PROTOCOLS).length; const trained=(a.trained||[]).length;
  return {
    radiation:{cum:cum.toFixed(1),rate:env.rad[D],spe:mission.schedule.filter(e=>e.type==='env'&&/solar/i.test(e.label)).length,status:cum>300?'warn':cum>150?'att':'ok'},
    isolation:{days:D,crew:mission.crewSize,mood:mood.value,stress:stress.value,status:worst(mood.status,stress.status)},
    distance:{delay:mission.commDelayMin(D),cached,trained,invOk:INVENTORY.filter(i=>!expired(i.exp)&&i.status==='ok').length,invTotal:INVENTORY.length,status:mission.commDelayMin(D)>5?'att':'ok'},
    gravity:{days:D,adherence,ctx:deviation(a,'ctx'),ex:deviation(a,'exercise'),status:worst(deviation(a,'ctx').status,deviation(a,'exercise').status,adherence<80?'att':'ok')},
    hostile:{co2:env.co2[D],hum:env.hum[D],pm:env.pm[D],status:worst(...Object.keys(ENV).map(k=>envStatus(k,env[k][D])))}
  };
}


/* ---------- Crew-wide helpers for mission-level pages (hazards, environment, crew) ---------- */
function crewMeanSeries(mission,m){ const crew=crewOf(mission.id); const D=mission.currentDay; const out=new Array(D+1).fill(null); for(let d=1;d<=D;d++){ const v=crew.map(c=>seriesFor(c,m).vals[d]).filter(x=>x!=null); if(v.length) out[d]=+mean(v).toFixed(3); } return out; }
function crewSystemStatuses(mission){ const crew=crewOf(mission.id); const st={},who={}; for(const s of SYSTEM_IDS){ let w='na'; who[s]=[]; for(const c of crew){ const x=systemStatus(c,s).status; who[s].push({name:c.name,status:x}); w=worst(w,x); } st[s]=w; } return {st,who}; }
function crewDeviationStatus(mission,m){ const ds=crewOf(mission.id).map(c=>deviation(c,m)).filter(d=>d.status!=='na'); return {value:ds.length?mean(ds.map(d=>d.value)):null,status:ds.length?worst(...ds.map(d=>d.status)):'na',n:ds.length}; }
function hazardExposureCrew(mission){ const crew=crewOf(mission.id); const D=mission.currentDay; const env=genEnv(mission); const cum=env.rad.slice(1,D+1).reduce((x,y)=>x+(y||0),0);
  const adh=Math.round(mean(crew.map(c=>100*(30-(c.missed||[]).filter(d=>d>D-30).length)/30)));
  const mood=crewDeviationStatus(mission,'mood'),stress=crewDeviationStatus(mission,'stress'),ctx=crewDeviationStatus(mission,'ctx'),ex=crewDeviationStatus(mission,'exercise');
  const cached=Object.keys(PROTOCOLS).length; const covered=Object.keys(PROTOCOLS).filter(p=>crew.some(c=>c.trained.includes(p))).length;
  return {radiation:{cum:cum.toFixed(1),rate:env.rad[D],spe:mission.schedule.filter(e=>e.type==='env'&&/solar/i.test(e.label)&&e.day<=D).length,status:cum>300?'warn':cum>150?'att':'ok'},
    isolation:{days:D,crew:mission.crewSize,mood:mood.value,stress:stress.value,status:worst(mood.status,stress.status)},
    distance:{delay:mission.commDelayMin(D),cached,covered,invOk:INVENTORY.filter(i=>!expired(i.exp)&&i.status==='ok').length,invTotal:INVENTORY.length,status:mission.commDelayMin(D)>5?'att':'ok'},
    gravity:{days:D,adherence:adh,ctx,ex,status:worst(ctx.status,ex.status,adh<80?'att':'ok')},
    hostile:{co2:env.co2[D],hum:env.hum[D],pm:env.pm[D],status:worst(...Object.keys(ENV).map(k=>envStatus(k,env[k][D])))}}; }
function correlateCrew(mission,target,window=30){ const D=mission.currentDay; const env=genEnv(mission); const tg=crewMeanSeries(mission,target); const wl=workloadSeries(mission);
  const cands=[...Object.keys(ENV).map(k=>({id:k,label:ENV[k].label,src:env[k],kind:'env'})),{id:'workload',label:'Scheduled high workload',src:wl,kind:'mission'},...['sleep','stress','hydration','rhr','exercise'].filter(m=>m!==target).map(m=>({id:m,label:METRICS[m].label+' (synthetic-profile mean)',src:crewMeanSeries(mission,m),kind:'health'}))];
  const out=[]; for(const c of cands){ let best=null; for(const lag of [0,1]){ const xs=[],ys=[]; for(let d=Math.max(2,D-window+1);d<=D;d++){ const x=c.src[d-lag],y=tg[d]; if(x!=null&&y!=null){ xs.push(x); ys.push(y);} } if(sd(xs)===0||sd(ys)===0) continue; const p=pearson(xs,ys); if(!best||Math.abs(p.r)>Math.abs(best.r)) best={...p,lag}; } if(best) out.push({...c,...best,strength:Math.abs(best.r)>=.6?'strong':Math.abs(best.r)>=.35?'moderate':'weak',sig:best.t>2.05}); }
  const crew=crewOf(mission.id).map(o=>({name:o.name,val:mean(windowVals(o,target,D-6,D))})).filter(o=>o.val!=null&&o.val>=2);
  return {rows:out.sort((x,y)=>Math.abs(y.r)-Math.abs(x.r)),crew,window}; }

/* ---------- Medical intelligence (rules-based, data-grounded) ---------- */
function answerQuestion(a,text){
  const q=text.toLowerCase(); const mission=getMission(a.mission); const D=mission.currentDay; const P=detectPatterns(a); const ov=overall(a);
  const li=xs=>'<ul>'+xs.map(x=>`<li>${x}</li>`).join('')+'</ul>';
  const devs=METRIC_IDS.map(m=>deviation(a,m)).filter(d=>d.status!=='na');
  const concerning=devs.filter(d=>ORDER[d.status]>=ORDER.att).sort((x,y)=>ORDER[y.status]-ORDER[x.status]);
  const trendsAdv=METRIC_IDS.map(m=>trend(a,m)).filter(t=>t.status!=='na'&&t.zc>=1).sort((x,y)=>y.zc-x.zc);
  const dataLine=d=>`${METRICS[d.m].label}: <b>${fmt(d.value,d.m)} ${METRICS[d.m].unit}</b> vs your baseline ${fmt(d.mean,d.m)} (${d.z.toFixed(1)} SD, ${STATUS_LABEL[d.status].toLowerCase()}) <span class="prov ${d.prov==='user'?'user':'sim'}">${d.prov==='user'?'USER INPUT':'SIMULATED'}</span>`;
  const lim='<div class="lim">Demonstration only. Rules compare readings with synthetic personal baselines and prototype reference bands. They are not clinically validated, do not diagnose or prescribe, and must not replace approved flight medical procedures or qualified medical judgement.</div>';
  const has=(...ws)=>ws.some(w=>q.includes(w));
  let h='';
  if(has('chang','trend','happening','going on')){
    h+='<h4>What is changing</h4>'+(trendsAdv.length?li(trendsAdv.slice(0,6).map(t=>`${METRICS[t.m].label} is ${t.dir} by ${fmt(Math.abs(t.change),t.m)} ${METRICS[t.m].unit} over 14 days (${t.zc.toFixed(1)} personal SD) <span class="prov der">DERIVED</span>`)):'<p>No indicator has moved more than one personal SD over the last 14 days.</p>');
    if(P.length) h+='<h4>Pattern</h4>'+li(P.map(p=>`<b>${p.title}</b> — ${p.explanation}`));
  } else if(has('concern','worr','abnormal','wrong','flag')){
    h+='<h4>Indicators outside your baseline</h4>'+(concerning.length?li(concerning.map(dataLine)):'<p>All available indicators are within one personal SD of baseline.</p>');
    const missing=METRIC_IDS.filter(m=>deviation(a,m).status==='na'); if(missing.length) h+=`<p class="small c-na">Not assessable (no recent data): ${missing.map(m=>METRICS[m].short).join(', ')}. Missing data is not normal data.</p>`;
  } else if(has('contribut','why','cause','because','factor','reason')){
    h+='<h4>Possible contributing factors</h4>';
    const sym=concerning.find(d=>['headache','fatigue','sleepq','mood','rhr','hrv'].includes(d.m)); const target=sym?sym.m:'fatigue'; const c=correlate(a,target);
    const active=missionAware(a).active;
    const f=[];
    if(active.length) f.push(`Mission context: ${active.map(e=>e.label).join('; ')} <span class="prov sim">SIMULATED</span>`);
    for(const r of c.rows.slice(0,4)) if(r.strength!=='weak') f.push(`${r.label} ${r.r>0?'rises':'falls'} with ${METRICS[target].short} (r = ${r.r.toFixed(2)}, ${r.n} days, ${r.strength}${r.lag?', 1-day lag':''}) <span class="prov der">DERIVED</span>`);
    const sl=deviation(a,'sleep'); if(sl.z>=1) f.push(`Sleep ${fmt(sl.value,'sleep')} h vs baseline ${fmt(sl.mean,'sleep')} h`);
    const hy=deviation(a,'hydration'); if(hy.z>=1) f.push(`Fluid intake ${fmt(hy.value,'hydration')} L vs baseline ${fmt(hy.mean,'hydration')} L`);
    const missed=(a.missed||[]).filter(d=>d>D-14).length; if(missed) f.push(`${missed} exercise sessions missed in 14 days`);
    if(c.crew.length) f.push(`Other crew reporting ${METRICS[target].short.toLowerCase()} this week: ${c.crew.map(x=>x.name).join(', ')} — suggests a shared exposure`);
    h+= f.length?li(f):'<p>No strong statistical associations in the last 30 days.</p>';
    h+='<p class="small c-muted">Correlation ranks candidates for investigation; it does not establish cause.</p>';
  } else if(has('assess','check','test','measure','should i do','next')){
    const asks=[...new Set(P.flatMap(p=>p.assess))]; const over=METRIC_IDS.filter(m=>METRICS[m].period&&deviation(a,m).status==='na');
    h+='<h4>Recommended assessments</h4>'+li([...(asks.length?asks:['Routine daily scan is sufficient today']),...over.map(m=>`${METRICS[m].label} is overdue — schedule it`)]);
    h+='<p class="small">Urgent symptoms (chest pain, breathlessness, fainting, worst-ever headache, sudden vision change) go straight to Emergency response — do not collect optional data first.</p>';
  } else if(has('interven','treat','counter','do about','plan','recover','improve')){
    const plan=buildPlan(a).filter(t=>!t.id.startsWith('gen-')); h+='<h4>Approved interventions available onboard</h4>'+li(plan.slice(0,8).map(t=>`<b>${t.t}</b> — ${t.why}${t.inv.length?` <span class="small c-muted">(${t.inv.map(i=>i.ok?i.name+' ✓':i.name+' ✗').join(', ')})</span>`:''}`));
    h+='<p class="small">Open Countermeasures & recovery to mark tasks complete and evaluate the response. ASTRA does not recommend medication, select treatments or provide doses; follow the current approved onboard procedure and qualified medical direction.</p>';
  } else if(has('escalat','seek','medical assistance','ground','surgeon','emergency','when should')){
    h+='<h4>Escalation guidance</h4>'+li([...P.map(p=>`${p.title}: ${p.escalate}`),'Any Level 1 symptom → Emergency response and immediate ground notification.',`Current one-way delay: ${mission.commDelayMin(D)} min. ${missionAware(a).up.some(e=>e.type==='comm')?'A blackout window is scheduled — send the handoff report before it.':'Ground consult is available with delay.'}`]);
    h+=`<p>Overall status now: <span class="tag s-${ov.status}">${STATUS_LABEL[ov.status]}</span>${ov.status==='crit'?' — escalate now.':ov.status==='warn'?' — flight-surgeon review recommended within 24 h.':' — routine reporting cadence is appropriate.'}</p>`;
  } else if(has('heart','cardio','bp','blood pressure','pulse')){
    const s=systemStatus(a,'heart'); h+='<h4>Cardiovascular</h4>'+li(s.rows.filter(r=>r.dev.status!=='na').map(r=>dataLine(r.dev)))+`<p>${SYSTEMS.heart.anatomy}</p>`;
  } else if(has('sleep','tired','fatigue')){
    const s=['sleep','sleepq','fatigue','reaction'].map(m=>deviation(a,m)).filter(d=>d.status!=='na'); h+='<h4>Sleep & fatigue</h4>'+li(s.map(dataLine))+'<p>Sleep restriction is the most common reversible driver of the recovery pattern. Protect the sleep opportunity before adjusting anything else.</p>';
  } else if(has('bone','muscle','exercise','strength')){
    const s=['ctx','exercise','strength'].map(m=>deviation(a,m)); h+='<h4>Bone & muscle</h4>'+li(s.map(d=>d.status==='na'?`${METRICS[d.m].label}: no recent data`:dataLine(d)))+`<p>${(a.missed||[]).filter(d=>d>D-30).length} exercise sessions missed in 30 days. ${SYSTEMS.bone.anatomy}</p>`;
  } else if(has('radiation','dose','solar')){
    const hx=hazardExposure(a).radiation; h+=`<h4>Radiation</h4><p>Cumulative mission dose <b>${hx.cum} mSv</b> at ${hx.rate} mSv/day today <span class="prov sim">SIMULATED</span>. Deep-space cruise reference ≈1.8 mSv/day <span class="prov real">REAL DATA</span> (MSL/RAD). ${hx.spe} solar particle event${hx.spe===1?'':'s'} recorded. This synthetic series is not a personal radiation-risk assessment. Biological risk depends on radiation quality, dose, dose rate and exposure context; mission radiation specialists interpret actual dosimetry.</p>`;
  } else if(has('headache','co2','co₂','air')){
    const c=correlate(a,'headache'); const top=c.rows[0]; h+=`<h4>Headache</h4><p>3-day mean headache ${fmt(deviation(a,'headache').value,'headache')}/10. Strongest association in 30 days: ${top?`${top.label} (r = ${top.r.toFixed(2)}, ${top.strength})`:'none'} <span class="prov der">DERIVED</span>. ${c.crew.length?'Other crew report headaches too, which favours a shared cabin exposure.':''} Red flags (worst-ever, neck stiffness, weakness, vision change) override everything — go to Emergency response.</p>`;
  } else if(has('inventory','supplies','medication','stock','drug')){
    const low=INVENTORY.filter(i=>i.reserve||expSoon(i.exp)||i.status!=='ok'); h+='<h4>Medical resources</h4>'+li(low.slice(0,8).map(i=>`${i.name}: ${i.qty} ${i.unit}${i.exp?', exp '+i.exp:''}${i.status!=='ok'?' — '+i.status:''}${i.reserve?' (emergency reserve)':''}`))+`<p>Allergies on file for ${a.name}: ${a.history.allergies.join(', ')}. Penicillin-class antibiotics are flagged accordingly.</p>`;
  } else {
    h+=`<h4>Summary for ${esc(a.name)}, mission day ${D}</h4><p>Overall status: <span class="tag s-${ov.status}">${STATUS_LABEL[ov.status]}</span>. ${concerning.length} indicator${concerning.length===1?'':'s'} outside baseline; ${P.length} pattern${P.length===1?'':'s'} detected.</p>`;
    if(P.length) h+=li(P.map(p=>`<b>${p.title}</b>: ${p.indicators[0]}`));
    h+='<p>Ask about what is changing, which measurements are concerning, contributing factors, what to assess next, available interventions, or when to escalate.</p>';
  }
  return h+lim;
}

/* ---------- Structured medical handoff report ---------- */
function handoffReport(a){
  const mission=getMission(a.mission); const D=mission.currentDay; const ov=overall(a); const P=detectPatterns(a); const env=genEnv(mission); const plan=buildPlan(a); const ev=evaluateResponse(a);
  const dev=METRIC_IDS.map(m=>deviation(a,m)).filter(d=>d.status!=='na'&&ORDER[d.status]>=ORDER.att);
  const L=[];
  L.push(`ASTRA MEDICAL HANDOFF REPORT`,`Mission: ${mission.name}   Mission day: ${D}   One-way delay: ${mission.commDelayMin(D)} min`,`Crew member: ${a.name} (${a.role}, ${a.age} ${a.sex})   Overall status: ${STATUS_LABEL[ov.status].toUpperCase()}`,'',
    `1. HISTORY  Conditions: ${a.history.conditions.join('; ')}. Allergies: ${a.history.allergies.join('; ')}. Medications: ${a.history.medications.join('; ')}.`,'',
    `2. PRESENTING PATTERN(S)`,...(P.length?P.flatMap(p=>[`  - ${p.title} [${STATUS_LABEL[p.status]}]`,...p.indicators.map(i=>`      ${i}`)]):['  - None detected']),'',
    `3. INDICATORS OUTSIDE PERSONAL BASELINE (3-day mean unless periodic)`,...(dev.length?dev.map(d=>`  - ${METRICS[d.m].label}: ${fmt(d.value,d.m)} ${METRICS[d.m].unit} (baseline ${fmt(d.mean,d.m)} ± ${fmt(d.sd,d.m)}; ${d.z.toFixed(1)} SD) [${d.prov==='user'?'USER INPUT':'SIMULATED'}]`):['  - None']),'',
    `4. ENVIRONMENT (today)  CO2 ${env.co2[D]} mmHg · O2 ${env.o2[D]}% · T ${env.temp[D]} °C · RH ${env.hum[D]}% · P ${env.press[D]} kPa · dose ${env.rad[D]} mSv/d [SIMULATED]`,
    `   Active mission context: ${missionAware(a).active.map(e=>e.label).join('; ')||'nominal operations'}`,'',
    `5. INTERVENTIONS  Completed: ${plan.filter(t=>t.done).map(t=>t.t).join('; ')||'none recorded'}`,`   Outstanding: ${plan.filter(t=>!t.done&&!t.id.startsWith('gen-')).map(t=>t.t).join('; ')||'none'}`,'',
    `6. RESPONSE TO TREATMENT  ${ev.summary}`,...ev.rows.map(r=>`  - ${METRICS[r.m].short}: ${fmt(r.prior,r.m)} → ${fmt(r.recent,r.m)} ${METRICS[r.m].unit} (${r.verdict})`),'',
    `7. QUESTIONS FOR GROUND`,...(P.length?P.map(p=>`  - ${p.title}: ${p.escalate}`):['  - Routine review only']),'',
    `Generated by ASTRA decision support. Simulated demonstration data; not a clinical record.`);
  return L.join('\n');
}
/* ===================== ASTRA VISUALISATIONS ===================== */
'use strict';
const CHARTS={}; let chartSeq=0;
const COLORS=['#ffffff','#eefc53','#6f8fe8','#e3684d','#aeb0b5','#9fb0ff','#c83922'];
const STATUS_COLOR={ok:'#9fb0ff',att:'#eefc53',warn:'#e3684d',crit:'#c83922',na:'#aeb0b5'};

/* series: [{name,color,points:[{x,y}],dashed,band:[{x,lo,hi}],prov}]  opts: {unit,yLabel,xLabel,height,baseline:{mean,sd},xMin,xMax,events:[{x,label,color}],yMin,yMax,todayX,refLines:[{y,label}],xFmt}
 */
function lineChart(series,opts={}){
  const id='c'+(++chartSeq); const W=720,H=opts.height||240,pl=48,pr=14,pt=16,pb=34;
  const pts=series.flatMap(s=>s.points.filter(p=>p.y!=null)); const bands=series.flatMap(s=>(s.band||[]));
  if(!pts.length) return `<div class="empty small">No data available for this indicator in the selected range.</div>`;
  let xMin=opts.xMin??Math.min(...pts.map(p=>p.x)), xMax=opts.xMax??Math.max(...pts.map(p=>p.x),...bands.map(b=>b.x)); if(xMax===xMin) xMax=xMin+1;
  let ys=[...pts.map(p=>p.y),...bands.flatMap(b=>[b.lo,b.hi])]; if(opts.baseline){ ys.push(opts.baseline.mean-2*opts.baseline.sd,opts.baseline.mean+2*opts.baseline.sd); } if(opts.refLines) ys.push(...opts.refLines.map(r=>r.y));
  let yMin=opts.yMin??Math.min(...ys), yMax=opts.yMax??Math.max(...ys); const pad=(yMax-yMin)*.12||1; yMin-=pad; yMax+=pad;
  const sx=x=>pl+(x-xMin)/(xMax-xMin)*(W-pl-pr), sy=y=>pt+(1-(y-yMin)/(yMax-yMin))*(H-pt-pb);
  let g='';
  const yt=niceTicks(yMin,yMax,5); for(const t of yt){ g+=`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${sy(t)}" y2="${sy(t)}"/><text class="lbl m" x="${pl-6}" y="${sy(t)+3.5}" text-anchor="end">${fmtTick(t)}</text>`; }
  const xt=niceTicks(xMin,xMax,8); for(const t of xt){ if(t<xMin||t>xMax) continue; g+=`<text class="lbl m" x="${sx(t)}" y="${H-pb+16}" text-anchor="middle">${opts.xFmt?opts.xFmt(t):Math.round(t)}</text>`; }
  g+=`<line class="ax" x1="${pl}" x2="${W-pr}" y1="${H-pb}" y2="${H-pb}"/><line class="ax" x1="${pl}" x2="${pl}" y1="${pt}" y2="${H-pb}"/>`;
  if(opts.baseline){ const b=opts.baseline; g+=`<rect x="${pl}" y="${sy(b.mean+b.sd)}" width="${W-pl-pr}" height="${Math.max(1,sy(b.mean-b.sd)-sy(b.mean+b.sd))}" fill="rgba(159,176,255,.07)"/><rect x="${pl}" y="${sy(b.mean+2*b.sd)}" width="${W-pl-pr}" height="${Math.max(1,sy(b.mean-2*b.sd)-sy(b.mean+2*b.sd))}" fill="rgba(159,176,255,.04)"/><line x1="${pl}" x2="${W-pr}" y1="${sy(b.mean)}" y2="${sy(b.mean)}" stroke="#9fb0ff" stroke-width="1" stroke-dasharray="4 3" opacity=".7"/><text class="lbl" x="${W-pr-4}" y="${sy(b.mean)-4}" text-anchor="end" fill="#9fb0ff">personal baseline</text>`; }
  for(const r of (opts.refLines||[])) g+=`<line x1="${pl}" x2="${W-pr}" y1="${sy(r.y)}" y2="${sy(r.y)}" stroke="${r.color||'#e3684d'}" stroke-width="1" stroke-dasharray="2 4" opacity=".8"/><text class="lbl" x="${pl+4}" y="${sy(r.y)-3}" fill="${r.color||'#e3684d'}">${r.label}</text>`;
  if(opts.todayX!=null&&opts.todayX>xMin&&opts.todayX<xMax) g+=`<line x1="${sx(opts.todayX)}" x2="${sx(opts.todayX)}" y1="${pt}" y2="${H-pb}" stroke="#aeb0b5" stroke-dasharray="3 3"/><text class="lbl" x="${sx(opts.todayX)+4}" y="${pt+10}">today</text>`;
  for(const e of (opts.events||[])) if(e.x>=xMin&&e.x<=xMax) g+=`<line x1="${sx(e.x)}" x2="${sx(e.x)}" y1="${pt}" y2="${H-pb}" stroke="${e.color||'#6f8fe8'}" opacity=".5"/><text class="lbl" x="${sx(e.x)+3}" y="${H-pb-4}" fill="${e.color||'#6f8fe8'}" font-size="9.5">${esc(e.label)}</text>`;
  series.forEach((s,i)=>{ const c=s.color||COLORS[i%COLORS.length];
    if(s.band&&s.band.length){ const up=s.band.map(b=>`${sx(b.x)},${sy(b.hi)}`), lo=s.band.slice().reverse().map(b=>`${sx(b.x)},${sy(b.lo)}`); g+=`<polygon points="${[...up,...lo].join(' ')}" fill="${c}" opacity=".13"/>`; }
    const ps=s.points.filter(p=>p.y!=null); if(!ps.length) return;
    let d=''; let prev=null; for(const p of ps){ d+=(prev&&p.x-prev.x<=(s.gap||1.5)?'L':'M')+`${sx(p.x)} ${sy(p.y)} `; prev=p; }
    g+=`<path d="${d}" fill="none" stroke="${c}" stroke-width="${s.width||1.8}" ${s.dashed?'stroke-dasharray="5 4"':''} stroke-linejoin="round" stroke-linecap="round"/>`;
    if(ps.length<=40||s.dots) for(const p of ps) g+=`<circle cx="${sx(p.x)}" cy="${sy(p.y)}" r="${s.dots?3:2}" fill="${p.prov==='user'?'#9fb0ff':c}" ${p.prov==='user'?'stroke="#fff" stroke-width="1"':''}/>`;
  });
  if(opts.yLabel) g+=`<text class="ttl" transform="rotate(-90)" x="${-(H/2)}" y="12" text-anchor="middle">${esc(opts.yLabel)}</text>`;
  g+=`<text class="ttl" x="${(W+pl)/2}" y="${H-4}" text-anchor="middle">${esc(opts.xLabel||'Mission day')}</text>`;
  g+=`<line id="${id}-cursor" x1="0" x2="0" y1="${pt}" y2="${H-pb}" stroke="#ffffff" stroke-width="1" opacity="0"/>`;
  CHARTS[id]={series,xMin,xMax,pl,pr,W,unit:opts.unit||'',xFmt:opts.xFmt};
  const leg=series.map((s,i)=>`<span><i style="background:${s.color||COLORS[i%COLORS.length]}" class="${s.dashed?'dash':''}"></i>${esc(s.name)}${s.prov?` <span class="prov ${s.prov}">${PROV[s.prov].l}</span>`:''}</span>`).join('');
  return `<div class="chart" data-chart="${id}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.yLabel||'chart')}">${g}</svg><div class="chart-tip"></div></div>${opts.noLegend?'':`<div class="chart-legend">${leg}</div>`}`;
}
function niceTicks(a,b,n){ const span=b-a; if(span<=0) return [a]; const raw=span/n, mag=Math.pow(10,Math.floor(Math.log10(raw))), norm=raw/mag; const step=(norm<1.5?1:norm<3?2:norm<7?5:10)*mag; const out=[]; for(let v=Math.ceil(a/step)*step;v<=b+1e-9;v+=step) out.push(+v.toFixed(6)); return out; }
function fmtTick(v){ return Math.abs(v)>=100?Math.round(v):Math.abs(v)>=10?+v.toFixed(1):+v.toFixed(2); }
function attachCharts(root){
  root.querySelectorAll('.chart[data-chart]').forEach(el=>{
    const c=CHARTS[el.dataset.chart]; if(!c) return; const svg=el.querySelector('svg'), tip=el.querySelector('.chart-tip'), cur=svg.querySelector('#'+el.dataset.chart+'-cursor');

  for(const h of hz) for(const s of sy){ const w=HAZARDS[h.id].edges[s.id]; if(!w) continue; const on=(!selHaz&&!selSys)||selHaz===h.id||selSys===s.id; const mx=(h.x+s.x)/2+(cx-(h.x+s.x)/2)*.25, my=(h.y+s.y)/2+(cy-(h.y+s.y)/2)*.25;
    g+=`<path class="rd-edge" d="M${h.x} ${h.y} Q${mx} ${my} ${s.x} ${s.y}" stroke="${HAZARDS[h.id].color}" stroke-width="${(w*5).toFixed(1)}" opacity="${on?(selHaz||selSys?.75:.3):.05}"/>`; }
  for(const h of hz){ const on=selHaz===h.id; g+=`<g class="rd-node ${on?'on':''}" data-haz="${h.id}" role="button" tabindex="0"><circle cx="${h.x}" cy="${h.y}" r="26" fill="#07122f" stroke="${HAZARDS[h.id].color}" stroke-width="${on?3:1.5}"/><circle cx="${h.x}" cy="${h.y}" r="9" fill="${HAZARDS[h.id].color}" opacity=".8"/><text x="${h.x}" y="${h.y+(h.y<cy?-34:46)}" text-anchor="middle">${HAZARDS[h.id].label}</text></g>`; }
  for(const s of sy){ const st=statuses[s.id]||'na'; const on=selSys===s.id; g+=`<g class="rd-node ${on?'on':''}" data-sys="${s.id}" role="button" tabindex="0"><circle cx="${s.x}" cy="${s.y}" r="17" fill="${STATUS_COLOR[st]}" fill-opacity=".85" stroke="#07122f" stroke-width="2"/><text x="${s.x}" y="${s.y+(s.y<cy?-23:30)}" text-anchor="middle" font-size="10">${SYSTEMS[s.id].label.split(' ')[0].replace('&','')}</text></g>`; }
  g+=`<text x="${cx}" y="${cy-4}" text-anchor="middle" fill="#aeb0b5" font-size="11">Body systems</text><text x="${cx}" y="${cy+12}" text-anchor="middle" fill="#7d8494" font-size="10">status by colour</text>`;
  return `<div class="radar"><svg viewBox="0 0 ${W} ${H}" aria-label="Spaceflight health risk radar">${g}</svg></div>`;
}

/* ---------- Timeline ---------- */
function timelineSVG(events,D,total,selDay,filters){
  const W=1100,H=170,pl=30,pr=30; const sx=d=>pl+d/total*(W-pl-pr);
  const lanes={milestone:30,exam:55,symptom:80,incident:80,treatment:105,env:130,eva:30,work:130,comm:130,exercise:105,procedure:105};
  const col={milestone:'#4f74d6',exam:'#ffffff',symptom:'#eefc53',incident:'#c83922',treatment:'#9fb0ff',env:'#6f8fe8',eva:'#e3684d',work:'#e3684d',comm:'#aeb0b5',exercise:'#9fb0ff',procedure:'#9fb0ff'};
  let g=`<line x1="${pl}" x2="${W-pr}" y1="150" y2="150" stroke="#33456f"/>`;
  for(let d=0;d<=total;d+=Math.max(10,Math.round(total/20/10)*10)) g+=`<line x1="${sx(d)}" x2="${sx(d)}" y1="146" y2="154" stroke="#33456f"/><text x="${sx(d)}" y="166" text-anchor="middle" fill="#aeb0b5" font-size="10" font-family="var(--mono)">${d}</text>`;
  g+=`<rect x="${sx(D)}" y="18" width="${sx(total)-sx(D)}" height="132" fill="rgba(255,255,255,.02)"/><line x1="${sx(D)}" x2="${sx(D)}" y1="18" y2="150" stroke="#ffffff" stroke-dasharray="3 3" opacity=".6"/><text x="${sx(D)+4}" y="28" fill="#ffffff" font-size="10">today · day ${D}</text>`;
  ['Milestones / EVA','Exams','Symptoms','Treatments','Environment'].forEach((l,i)=>g+=`<text x="${pl}" y="${[30,55,80,105,130][i]-10}" fill="#7d8494" font-size="9.5">${l}</text>`);
  for(const e of events){ if(filters&&!filters.has(e.type)) continue; const y=lanes[e.type]||80; const on=selDay===e.day;
    if(e.span) g+=`<rect x="${sx(e.day)}" y="${y-5}" width="${sx(e.day+e.span)-sx(e.day)}" height="10" rx="5" fill="${col[e.type]}" opacity=".35"/>`;
    g+=`<g class="tl-ev ${on?'on':''}" data-day="${e.day}" role="button" tabindex="0"><title>Day ${e.day}: ${esc(e.label)}</title><circle cx="${sx(e.day)}" cy="${y}" r="${on?7:5}" fill="${col[e.type]}" stroke="#07122f" stroke-width="1.5"/></g>`; }
  return `<div class="tl-wrap"><div class="tl"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Mission timeline">${g}</svg></div></div>`;
}

const SCAN_FIELDS={core:['rhr','sbp','dbp','temp','spo2','rr'],sleep:['sleep','sleepq','fatigue'],mind:['mood','stress','headache','dizzy'],intake:['hydration','appetite'],perf:['exercise','reaction','memory'],periodic:['strength','mass','balance','ctx','vision','skin']};

const ASSESSMENT_TYPES=[
  {id:'sensorimotor',label:'Sensorimotor / balance assessment',period:7,unit:'/100'},
  {id:'cbc',label:'CBC / immune surveillance',period:30,unit:'reported result'},
  {id:'ctx',label:'Bone resorption marker (CTX)',period:30,unit:'ng/mL'},
  {id:'ocular',label:'Visual acuity / ocular assessment',period:30,unit:'logMAR / report'},
  {id:'cardio',label:'Cardiovascular assessment',period:30,unit:'reported result'},
  {id:'resp',label:'Respiratory assessment',period:30,unit:'reported result'}
];
function assessmentState(a,type,D){
  const spec=ASSESSMENT_TYPES.find(x=>x.id===type);
  const records=(State.assessments[a.id]||[]).filter(x=>x.type===type&&x.day<=D&&x.quality!=='invalid').sort((x,y)=>y.day-x.day);
  const last=records[0];
  if(!last) return D<spec.period?'not due':'overdue';
  if(last.day===D) return last.status||'completed';
  const gap=D-last.day;
  if(gap>spec.period) return 'overdue';
  if(gap>=spec.period-2) return 'due';
  return 'not due';
}
function extraScanPanels(a,mission){

  const sleepLogs=allDaily.slice(0,7);

  const onsetVariability=circSD(sleepLogs.map(x=>x.sleepStart));

  const meal=(k,label)=>`<div class="meal-entry"><div class="meal-name">${label}</div><div class="grid g2">${input(k,'Meal / food notes','text',daily[k]||'')}${select(k+'Status','Acceptability',[['not-recorded','Not recorded'],['consumed','Consumed as planned'],['partial','Partially consumed'],['skipped','Skipped']],daily[k+'Status']||'not-recorded')}</div></div>`;

      <p class="small c-muted" style="margin-top:8px">${onsetVariability!=null?`Last ${sleepLogs.length} logged nights · sleep-onset variability ${onsetVariability} min${wakeVariability!=null?` · wake-time variability ${wakeVariability} min`:''} (circular standard deviation).`:'Log sleep onset and wake time across multiple nights to calculate schedule variability.'}</p>

      ${aselect('assessmentType','Assessment type',ASSESSMENT_TYPES.map(t=>[t.id,t.label]),'sensorimotor')}

      ${ainput('assessmentResult','Result / summary','text','')}
      ${ainput('assessmentUnit','Units','text','')}
      ${ainput('assessmentMethod','Method','text','')}

      ${aselect('assessmentQuality','Quality',[['acceptable','Acceptable'],['questionable','Questionable'],['invalid','Invalid / exclude']], 'acceptable')}
    </div>

  </div>`;
}
PAGES.scan={title:'Daily health scan & assessment log',render(a,mission){

    ${panel('Multi-indicator view — recovery cluster (personal SD units, adverse direction up)',`${lineChart(zser,{unit:'SD',yLabel:'Adverse deviation (SD)',height:240,refLines:[{y:1,label:'1 SD',color:'#eefc53'},{y:2,label:'2 SD',color:'#e3684d'}],xMin:Math.max(1,D-29),xMax:D})}<p class="sub" style="margin-top:8px">Each indicator is expressed as deviation from its own baseline so that heart rate, HRV, sleep, exercise, mood and fatigue can be read together. Indicators moving above 1 SD together form the recovery pattern.</p>`,prov('der'))}
    ${panel('Detected patterns',P.length?P.map(p=>`<details class="x" ${P[0]===p?'open':''}><summary>${esc(p.title)} ${tag(p.status)}</summary><div class="body"><p>${esc(p.explanation)}</p><b>Indicators</b><ul>${p.indicators.map(i=>`<li>${esc(i)}</li>`).join('')}</ul><b>Recommended assessments</b><ul>${p.assess.map(i=>`<li>${esc(i)}</li>`).join('')}</ul><b>Escalation rule</b><p>${esc(p.escalate)}</p></div></details>`).join(''):'<p class="sub">No pattern detected. Individual deviations are listed in the dashboard alerts.</p>',prov('der'))}

/* ---------------- Mental & cognitive health ---------------- */
PAGES.mental={title:'Mental & cognitive health',render(a,mission){

  const tests=(State.tests[a.id]||[]).slice().reverse(); const last=tests[0];
  const cmp=(m,v)=>{ const b=a.baseline[m]; const z=adverseZ(m,v,b); return `${fmt(v,m)} ${METRICS[m].unit} vs baseline ${fmt(b.mean,m)} ${tag(statusFromZ(z))}`; };
  const tabs=[['overview','Overview'],['tests','Cognitive tests'],['wellbeing','Wellbeing resources']];
  let body='';
  if(UI.mentalTab==='overview') body=`<div class="grid g2">${panel('Mood, stress & fatigue (30 d)',lineChart([ser('mood','#ffffff'),ser('stress','#e3684d'),ser('fatigue','#eefc53')],{unit:'/10',yLabel:'/10',yMin:0,yMax:10,height:220})+note('Daily self-ratings on a 0–10 scale. Rising stress or fatigue together with falling mood over several days is a recovery signal; a single difficult day is not.'),prov('sim')+' self-report')}${panel('Sleep (30 d)',lineChart([ser('sleep','#6f8fe8')],{unit:'h',yLabel:'hours',baseline:a.baseline.sleep,height:220})+note('Hours of sleep per night. The shaded band is this crew member’s own normal range (±1 and ±2 SD). Sustained short sleep is the most common reversible driver of the other changes ASTRA watches.'),prov('sim'))}</div>
    <div class="grid g3" style="margin-top:14px">${['mood','stress','fatigue','sleepq','reaction','memory'].map(m=>kpiTile(a,m)).join('')}</div>
    <div class="callout" style="margin-top:14px">Mood and stress are self-reports. ASTRA treats a sustained move below your own baseline as a prompt for a conversation and support, never as a diagnosis. Individual entries stay private unless you choose to share them (System → privacy).</div>`;
  else if(UI.mentalTab==='tests') body=`<div class="grid g3">
      ${panel('Reaction time',`<p class="sub">Tap the pad as soon as it turns green. 5 trials.</p><div class="rt-pad wait" id="rt-pad" data-action="rt">Tap to start</div><div id="rt-out" class="small" style="margin-top:8px"></div>`)}
      ${panel('Working memory',`<p class="sub">Memorise the sequence, then reproduce it. Length grows to 7.</p><div id="mem-box"><button class="btn" data-action="memstart">Start</button></div>`)}
      ${panel('Attention',`<p class="sub">Tap every <b>K</b> in the grid within 20 s.</p><div id="att-box"><button class="btn" data-action="attstart">Start</button></div>`)}
    </div>
    ${panel('Results vs personal baseline',last?`<p>Latest (day ${last.day}): ${last.reaction!=null?'Reaction '+cmp('reaction',last.reaction):''} ${last.memory!=null?' · Memory '+cmp('memory',last.memory):''} ${last.attention!=null?` · Attention ${last.attention}% correct`:''} ${prov('user')}</p>${tests.length>1?`<p class="sub">${tests.length} sessions recorded. Deterioration across several sessions, especially with poor sleep, prompts further evaluation.</p>`:''}`:'<p class="sub">No test completed yet in this session. Simulated daily reaction and memory scores are shown in Overview.</p>','','')}`;
  else body=`<div class="grid g2">${panel('Guided breathing',`<p class="sub">Box breathing: 4 s in, 4 s hold, 4 s out, 4 s hold. Follow the circle.</p><div class="breath out" id="breath">Ready</div><div class="row" style="justify-content:center"><button class="btn" data-action="breath">Start 2 minutes</button></div>`)}
    ${panel('Approved support resources',`<ul class="small"><li>Private behavioural-health conference with the ground psychologist (schedule according to the mission medical plan; request support via Earth communication).</li><li>Crew conflict-resolution guide (cached offline).</li><li>Sleep hygiene and light-schedule protocol (cached offline).</li><li>Personal media and family message library.</li><li>Peer check-in: optional, crew-agreed pairing.</li></ul><div class="callout">If you have thoughts of harming yourself or others, use the Medical officer / ground emergency channel immediately. ASTRA will not share this unless you choose to.</div>`)}</div>
    ${panel('Synthetic-profile wellbeing (privacy-preserving)',`<p class="sub">Aggregated across synthetic demonstration profiles without individual values. See ${linkTo('crew','Profile resilience')}.</p>`)}`;
  return `<div class="page-head"><div><h1>Mental & cognitive health</h1><p>Mood, stress, sleep, fatigue and short cognitive tests compared with your own baseline.</p></div></div><div class="tabs">${tabs.map(t=>`<button class="${UI.mentalTab===t[0]?'on':''}" data-action="mentaltab" data-tab="${t[0]}">${t[1]}</button>`).join('')}</div>${body}`; }};

/* ---------------- Five-hazard exposure intelligence ---------------- */
PAGES.hazards={title:'Five-hazard exposure',render(a,mission){
  const hx=hazardExposureCrew(mission); const cs=crewSystemStatuses(mission); const statuses=cs.st; const D=mission.currentDay;
  const card=(id,rows)=>`<div class="panel tight" data-action="haz" data-haz="${id}" role="button" tabindex="0" style="cursor:pointer;border-color:${UI.haz===id?HAZARDS[id].color:'var(--line)'}"><div class="row between"><b style="color:${HAZARDS[id].color}">${HAZARDS[id].label}</b>${tag(hx[id].status)}</div><div class="small c-muted" style="margin:4px 0 8px">${esc(HAZARDS[id].desc)}</div>${rows.map(r=>`<div class="row between small"><span class="c-muted">${r[0]}</span><span class="num">${r[1]}</span></div>`).join('')}</div>`;
  const cards=`<div class="grid g5">
    ${card('radiation',[['Cumulative dose',`${hx.radiation.cum} mSv ${prov('sim')}`],['Today',`${hx.radiation.rate} mSv/d`],['SPE events',hx.radiation.spe],['Deep-space ref.',`1.8 mSv/d ${prov('real')}`]])}
    ${card('isolation',[['Scenario day',hx.isolation.days],['Synthetic profiles analysed',hx.isolation.crew],['Profile mood (3 d mean)',fmt(hx.isolation.mood,'mood')+'/10'],['Profile stress (3 d mean)',fmt(hx.isolation.stress,'stress')+'/10']])}
    ${card('distance',[['One-way delay',`${hx.distance.delay} min`],['Cached protocols',hx.distance.cached],['Protocols with a trained crew member',`${hx.distance.covered}/${hx.distance.cached}`],['Inventory nominal',`${hx.distance.invOk}/${hx.distance.invTotal}`]])}
    ${card('gravity',[['Crew exercise adherence (30 d)',`${hx.gravity.adherence}%`],['Exercise output (synthetic-profile mean)',hx.gravity.ex.status==='na'?'—':fmt(hx.gravity.ex.value,'exercise')+'%'],['CTX (synthetic-profile mean)',hx.gravity.ctx.status==='na'?'—':fmt(hx.gravity.ctx.value,'ctx')+' ng/mL'],['Days in µg',hx.gravity.days]])}
    ${card('hostile',[['CO₂',`${hx.hostile.co2} mmHg`],['Humidity',`${hx.hostile.hum}%`],['PM2.5',`${hx.hostile.pm} µg/m³`],['Status',tag(hx.hostile.status)]])}
  </div>`;
  const sel=UI.haz, ss=UI.rsys; let detail='';
  if(sel){ const H=HAZARDS[sel]; detail=`<h3 style="color:${H.color};margin-top:0">${H.label}</h3><p>${esc(H.desc)}</p><h3>Connected body systems</h3><div class="stack">${Object.entries(H.edges).sort((x,y)=>y[1]-x[1]).map(([s,w])=>`<div class="sys-item ${ss===s?'on':''}" data-action="rsys" data-sys="${s}"><span class="dot ${statuses[s]}"></span><span class="n">${SYSTEMS[s].label} <span class="c-muted small">· link strength ${Math.round(w*100)}%</span><div class="small c-muted">${esc(H.why[s])}</div></span>${tag(statuses[s])}</div>`).join('')}</div><h3>What ASTRA tracks</h3><p class="small">${H.measures.map(esc).join(' · ')}</p><h3>Countermeasures</h3><ul class="small">${H.countermeasures.map(c=>`<li>${esc(c)}</li>`).join('')}</ul>`; }
  else if(ss){ const S=SYSTEMS[ss]; detail=`<h3 style="margin-top:0">${S.label} ${tag(statuses[ss])}</h3><p>${esc(S.anatomy)}</p><h3>Hazards acting on this system</h3><ul class="small">${HAZARD_IDS.filter(h=>HAZARDS[h].edges[ss]).sort((x,y)=>HAZARDS[y].edges[ss]-HAZARDS[x].edges[ss]).map(h=>`<li><b style="color:${HAZARDS[h].color}">${HAZARDS[h].label}</b> (${Math.round(HAZARDS[h].edges[ss]*100)}%) — ${esc(HAZARDS[h].why[ss])}</li>`).join('')}</ul><h3>Crew status for this system</h3>${cs.who[ss].map(w=>`<div class="row between small"><span>${esc(w.name)}</span>${tag(w.status)}</div>`).join('')}<p class="sub" style="margin-top:8px">Select a crew member on the Body map or Trends pages for the individual indicators.</p>`; }
  else detail='<div class="empty">Select a hazard (outer ring) or a body system (inner ring) to explore the relationships, the measurements that evidence them and the available countermeasures.</div>';
  const c=correlateCrew(mission,UI.corrTarget); const corrTargets=['headache','fatigue','sleepq','mood','rhr','dizzy','skin','rr'];
  return `<div class="page-head"><div><h1>Five-hazard exposure intelligence</h1><p>NASA’s five human-spaceflight hazard categories, with synthetic exposure scenarios and links to relevant body systems. This page aggregates only the synthetic demonstration profiles selected for the historical mission context.</p></div></div>
  ${cards}
  ${note('Each column is one of NASA’s five human-spaceflight hazards with this mission’s exposure to it. Values marked REAL DATA are published reference figures; everything else is simulated. Hazard scores and alert cut-offs are ASTRA demonstrator heuristics, not NASA risk ratings or medical limits. Select a column to see which body systems it affects.')}
  <div class="grid g-32" style="margin-top:14px">
    ${panel('Spaceflight health risk radar',`${radarSVG(statuses,sel,ss)}<p class="sub">Line thickness = strength of the documented relationship (HRP risk evidence, encoded by ASTRA). Node colour = the worst current status for that system across the synthetic profiles. ${sel||ss?'<button class="btn sm" data-action="rclear">Clear selection</button>':''}</p>`,prov('der'))}
    ${panel('Relationships',detail)}
  </div>
  ${panel('Exposure-to-health correlation engine',`<div class="row"><span class="small c-muted">Investigate</span>${corrTargets.map(t=>`<button class="chip ${UI.corrTarget===t?'on':''}" data-action="corr" data-t="${t}">${METRICS[t].short}</button>`).join('')}<span class="small c-muted">· synthetic-profile mean · last ${c.window} days</span></div>
    <div class="scrollx" style="margin-top:10px"><table class="tbl"><tr><th>Candidate factor</th><th>Type</th><th>r</th><th>Days</th><th>Lag</th><th>Evidence</th><th>Interpretation</th></tr>${c.rows.slice(0,9).map(r=>`<tr><td>${esc(r.label)}</td><td class="c-muted">${r.kind}</td><td class="num ${Math.abs(r.r)>=.35?(r.r>0?'c-warn':'c-cyan'):'c-muted'}">${r.r.toFixed(2)}</td><td class="num">${r.n}</td><td class="num">${r.lag} d</td><td>${r.strength==='strong'?'<span class="tag s-warn">strong</span>':r.strength==='moderate'?'<span class="tag s-att">moderate</span>':'<span class="tag s-na">weak</span>'}${r.sig?'':' <span class="small c-muted">n.s.</span>'}</td><td class="small">${r.strength==='weak'?'No meaningful association in this window.':`Crew-mean ${METRICS[UI.corrTarget].short.toLowerCase()} tends to be ${r.r>0?'higher':'lower'} when ${r.label.toLowerCase()} is higher${r.lag?' the day before':''}.`}</td></tr>`).join('')}</table></div>
    <div class="row" style="margin-top:10px">${c.crew.length?`<div class="callout warn">Synthetic-profile cross-check: ${c.crew.map(x=>esc(x.name)).join(', ')} show elevated ${METRICS[UI.corrTarget].short.toLowerCase()} this week — a shared cabin exposure becomes more likely.</div>`:`<div class="callout">Synthetic-profile cross-check: no other synthetic profile shows elevated ${METRICS[UI.corrTarget].short.toLowerCase()} this week.</div>`}</div>
    <p class="sub" style="margin-top:8px">Pearson correlation of the synthetic-profile mean symptom over ${c.window} days at 0- and 1-day lag, ranked by |r|. Correlation ranks candidates for investigation. It does not prove cause: confounding (for example a workload period that simultaneously raises CO₂, cuts sleep and skips exercise) is common and is why ASTRA shows the mission context alongside.</p>`,prov('der'))}`; }};

  const pts=[]; for(let d=from;d<=D;d++) pts.push({x:d,y:env[k][d]}); const hd=crewMeanSeries(mission,'headache'); const hp=[]; for(let d=from;d<=D;d++) if(hd[d]!=null) hp.push({x:d,y:hd[d]});
  const ranges={co2:[0,8],o2:[17,23],temp:[15,30],hum:[10,80],press:[90,106],pm:[0,80],noise:[40,90],water:[60,100],rad:[0,4]};

  <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(210px,1fr))">${gauges}</div>

  <div class="grid g-21" style="margin-top:14px">
    ${panel(`${E.label} — 30 days with headache overlay`,`${lineChart([{name:E.label,points:pts,color:'#ffffff',prov:'sim'},{name:'Headache (synthetic-profile mean)',points:hp,color:'#eefc53',dashed:true,width:1.2,prov:'sim'}],{unit:E.unit,yLabel:E.unit+' (headache on same scale)',height:260,refLines:E.bad==='high'?[{y:E.warn,label:'warning',color:'#e3684d'}]:E.bad==='low'?[{y:E.warn,label:'warning',color:'#e3684d'}]:[{y:E.lo[0],label:'low',color:'#e3684d'},{y:E.lo[1],label:'high',color:'#e3684d'}],xMin:from,xMax:D})}<p class="sub" style="margin-top:8px">${esc(E.ref)} Headache is plotted on the same axis for visual comparison only; use the correlation engine in Hazards for the statistics.</p>`)}
    <div class="stack">

      ${panel('Synthetic-profile symptom cross-check (7 d)',`<p class="sub">Mean headache score per synthetic profile. Simultaneous symptoms across multiple profiles indicate a shared scenario exposure, not observed crew data.</p>${crewHead.map(o=>`<div class="row between small"><span>${esc(o.n)}</span><span class="num">${o.v.toFixed(1)}/10 ${o.v>=2?'<span class="tag s-att">elevated</span>':''}</span></div>`).join('')}<p class="sub" style="margin-top:6px">Aggregate view only; individual mood records are not shown here. ${linkTo('hazards','Run the correlation engine')}.</p>`)}

/* ---------------- Crew resilience (privacy-preserving) ---------------- */
PAGES.crew={title:'Demonstration profile resilience',render(a,mission){
  const crew=crewOf(mission.id); const D=mission.currentDay; const from=Math.max(1,D-29);
  const agg=m=>{ const p=[]; for(let d=from;d<=D;d++){ const v=crew.map(c=>seriesFor(c,m).vals[d]).filter(x=>x!=null); if(v.length>=Math.max(1,crew.length-1)) p.push({x:d,y:+mean(v).toFixed(2)}); } return p; };
  const share=State.privacy.shareMood;
  const kpis=[['fatigue','Profile mean fatigue'],['sleep','Profile mean sleep'],['mood','Profile mean mood'],['exercise','Profile mean exercise output']].map(([m,l])=>{ const v=mean(crew.map(c=>deviation(c,m).value).filter(x=>x!=null)); const b=mean(crew.map(c=>c.baseline[m].mean)); const z=adverseZ(m,v,{mean:b,sd:mean(crew.map(c=>c.baseline[m].sd))}); return `<div class="kpi s-${statusFromZ(z)}"><span class="bar"></span><div class="lbl"><span>${l}</span>${tag(statusFromZ(z))}</div><div class="val">${fmt(v,m)}<small>${METRICS[m].unit}</small></div><div class="delta"><span>synthetic baseline ${fmt(b,m)}</span>${prov('der')}</div></div>`; }).join('');
  const missedAll=crew.reduce((s,c)=>s+(c.missed||[]).filter(d=>d>D-14).length,0);
  const flags=[]; const fz=m=>{ const v=mean(crew.map(c=>deviation(c,m).value).filter(x=>x!=null)); const b=mean(crew.map(c=>c.baseline[m].mean)); return adverseZ(m,v,{mean:b,sd:mean(crew.map(c=>c.baseline[m].sd))}); };
  if(fz('fatigue')>=1) flags.push('Profile-group fatigue is above the pooled synthetic baseline — review workload distribution.'); if(fz('sleep')>=1) flags.push('Sleep is short across synthetic profiles — check the light/sleep schedule and noise.'); if(missedAll>=4) flags.push(`${missedAll} exercise sessions missed across synthetic profiles in 14 days — sessions are being displaced by tasks.`); if(crew.filter(c=>deviation(c,'headache').value>=2).length>=2) flags.push('Two or more synthetic profiles show headaches — check cabin CO₂ (Environment).');
  return `<div class="page-head"><div><h1>Demonstration profile resilience</h1><p>Aggregates across ${crew.length} synthetic demonstration profiles. These are not actual crewmembers or observed crew-health records; no individual mood or mental-health value appears on this page.</p></div></div>
  <div class="grid g4" style="margin-bottom:14px">${kpis}</div>
  <div class="grid g-21">
    ${panel('Synthetic-profile aggregates (30 d)',lineChart([{name:'Mean fatigue /10',points:agg('fatigue'),color:'#eefc53'},{name:'Mean mood /10',points:agg('mood'),color:'#ffffff'},{name:'Mean sleep h',points:agg('sleep'),color:'#6f8fe8'}],{unit:'',yLabel:'synthetic-profile mean',height:260,xMin:from,xMax:D})+note('Each line is the average across the selected synthetic profiles for that day. Shared movement reflects the scenario model and does not establish a cause.'),prov('der'))}
    <div class="stack">
      ${panel('Scenario-level signals',flags.length?`<div class="stack">${flags.map(f=>`<div class="alert s-att"><span class="dot att" style="margin-top:6px"></span><div class="d">${esc(f)}</div></div>`).join('')}</div>`:'<p class="sub">No scenario-level concern detected.</p>')}
      ${panel('Simulated check-in coverage',`<div class="row between small"><span>Illustrative daily check-in coverage (7 d)</span><span class="num">${Math.round(100*(crew.length*7-crew.reduce((s,c)=>s+(c.missed||[]).filter(d=>d>D-7).length,0))/(crew.length*7))}%</span></div><div class="row between small"><span>Illustrative peer-pairing uptake</span><span class="num">${share?`${Math.min(crew.length,Math.round(crew.length*.75))} of ${crew.length}`:'—'}</span></div><p class="sub" style="margin-top:6px">Participation counts are shown, not content.</p>`)}
      ${panel('Privacy controls',`<label class="check"><input type="checkbox" data-action="privacy" ${share?'checked':''}><span>Record a consent preference for sharing individual mood and stress entries with the medical officer and ground behavioural-health team.</span></label><p class="sub" style="margin-top:6px">Default off. In this standalone demo the toggle records a preference only; no data is transmitted. Aggregates are calculated locally and individual entries are not shown on this page.</p>`)}
    </div>
  </div>`; }};

/* ---------------- Scenario trajectory model ---------------- */
PAGES.twin={title:'Scenario model',render(a,mission){
  const ov=overall(a); const statuses={}; for(const s of SYSTEM_IDS) statuses[s]=ov.systems[s].status; const D=mission.currentDay; const T=UI.twin;
  const sim=simulate(a,{sleep:T.sleep,adherence:T.adherence,nutrition:T.nutrition,workload:T.workload,recovery:false},30);
  const proj={}; for(const m of ['rhr','hrv','exercise','ctx','mood','sleepq']){ const last=sim.traj[m][29].y; proj[m]={now:sim.start[m],then:last,status:statusFromZ(adverseZ(m,last,a.baseline[m]))}; }
  const projSys={...statuses}; projSys.heart=worst(proj.rhr.status,proj.hrv.status); projSys.muscle=proj.exercise.status; projSys.bone=proj.ctx.status; projSys.brain=worst(proj.mood.status,proj.sleepq.status);
  const rings=SYSTEM_IDS.map(s=>{ const ss=ov.systems[s]; const measured=ss.rows.filter(r=>r.dev.status!=='na').length; return `<div class="ring" data-action="go" data-page="bodymap" data-sys="${s}" role="button" tabindex="0" style="cursor:pointer">${ringSVG(ss.rows.length?measured/ss.rows.length:0,ss.status)}<div><div class="small">${SYSTEMS[s].label}</div><div class="small c-muted">${measured}/${ss.rows.length} indicators current · ${STATUS_LABEL[ss.status]}</div></div></div>`; }).join('');
  const slider=(k,label,min,max,step,fmtf)=>`<div class="field"><label>${label}: <b class="num">${fmtf(T[k])}</b></label><input type="range" min="${min}" max="${max}" step="${step}" value="${T[k]}" data-input="twin" data-k="${k}"></div>`;
  const hist=['rhr','hrv','exercise','mood'].map((m,i)=>{ const s=seriesFor(a,m).vals; const b=a.baseline[m]; const p=[]; for(let d=1;d<=D;d+=Math.max(1,Math.floor(D/60))) if(s[d]!=null) p.push({x:d,y:+adverseZ(m,s[d],b).toFixed(2)}); return {name:METRICS[m].short,points:p,color:COLORS[i],width:1.3,gap:Math.max(2,Math.floor(D/60)+1)}; });
  const futures=['rhr','hrv','exercise','mood'].map((m,i)=>({name:METRICS[m].short+' (modelled)',points:sim.traj[m].map(p=>({x:p.day,y:+adverseZ(m,p.y,a.baseline[m]).toFixed(2)})),color:COLORS[i],dashed:true,width:1.3}));
  return `<div class="page-head"><div><h1>Scenario trajectory model</h1><p>A profile-specific, simplified scenario model using ${esc(a.name)}’s synthetic baseline, ${D} days of demonstration readings and simulated mission exposures. It is not a biological digital twin or a validated prediction.</p></div></div>
  <div class="twin-wrap">

  ${note('Triage levels and vital-sign cut-offs are ASTRA prototype rules, not validated medical triage criteria. The equipment check uses a synthetic manifest. This page is for software demonstration only; do not use it to direct patient care.')}

      ${panel('Vital signs (optional)',`<div class="grid g2">${vital('hr','Heart rate','bpm')}${vital('sbp','Systolic BP','mmHg')}${vital('spo2','SpO₂','%')}${vital('temp','Temperature','°C')}</div>`)}
      ${panel('Patient record',`<p class="small"><b>${esc(a.name)}</b> · ${a.age} ${a.sex} · Allergies: <span class="c-warn">${a.history.allergies.map(esc).join(', ')}</span> · Conditions: ${a.history.conditions.map(esc).join(', ')} · Medications: ${a.history.medications.map(esc).join(', ')}</p><p class="small">Current flags: ${detectPatterns(a).map(p=>esc(p.title)).join('; ')||'none'}</p>`)}

PAGES.countermeasures={title:'Countermeasures & recovery',render(a,mission){
  const plan=buildPlan(a); const cats=[...new Set(plan.map(t=>t.cat))]; const ev=evaluateResponse(a); const Sm=UI.sim; const D=mission.currentDay;

  else if(UI.cmTab==='sim') body=`<div class="grid g-12"><div class="stack">${slider('sleep','Sleep per night',5,9,.5,v=>v+' h')}${slider('adherence','Exercise adherence',0,1,.1,v=>Math.round(v*100)+'%')}${slider('nutrition','Energy & protein intake',.6,1.1,.05,v=>Math.round(v*100)+'%')}${slider('workload','Workload',.8,1.6,.1,v=>v===1?'normal':Math.round(v*100)+'%')}<label class="check"><input type="checkbox" data-input="simrec" ${Sm.recovery?'checked':''}><span>Add structured recovery protocol (light schedule, reduced load days)</span></label><div class="chips">${['rhr','hrv','exercise','ctx','mood','sleepq'].map(x=>`<button class="chip ${x===m?'on':''}" data-action="simmetric" data-m="${x}">${METRICS[x].short}</button>`).join('')}</div></div>
    <div><div id="sim-chart">${chart}</div><div class="callout" style="margin-top:10px">${prov('hyp')} Three hypothetical 30-day trajectories from today’s readings. Orange: present sleep, adherence and workload continue. Cyan: your scenario. Green: illustrative full-countermeasure scenario. Bands show model noise, not clinical confidence. Expected benefits are evidence-informed directions, not guaranteed outcomes.</div><details class="x"><summary>Model assumptions</summary><div class="body"><ul>${SIM_ASSUMPTIONS.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></details></div></div>`;

function saveTest(rec){ const {a,mission}=ctx(); const arr=State.tests[a.id]=State.tests[a.id]||[]; let today=arr.find(t=>t.day===mission.currentDay); if(!today){ today={day:mission.currentDay}; arr.push(today); } Object.assign(today,rec); save(); }
function reactionTest(pad){ const T=UI.test&&UI.test.kind==='rt'?UI.test:(UI.test={kind:'rt',phase:'idle',times:[]}); const out=document.getElementById('rt-out');
  if(T.phase==='idle'||T.phase==='done'){ T.times=[]; T.phase='wait'; pad.className='rt-pad wait'; pad.textContent='Wait for green…'; T.timer=setTimeout(()=>{ T.phase='go'; T.t0=performance.now(); pad.className='rt-pad go'; pad.textContent='TAP'; },1500+Math.random()*2000); return; }
  if(T.phase==='wait'){ clearTimeout(T.timer); pad.textContent='Too early — tap to restart'; pad.className='rt-pad wait'; T.phase='idle'; return; }
  if(T.phase==='go'){ const rt=Math.round(performance.now()-T.t0); T.times.push(rt); if(T.times.length<5){ T.phase='wait'; pad.className='rt-pad wait'; pad.textContent=`${rt} ms · wait…`; T.timer=setTimeout(()=>{ T.phase='go'; T.t0=performance.now(); pad.className='rt-pad go'; pad.textContent='TAP'; },1500+Math.random()*2000); }
    else { T.phase='done'; const med=T.times.slice().sort((x,y)=>x-y)[2]; pad.className='rt-pad wait'; pad.textContent=`Median ${med} ms · tap to repeat`; saveTest({reaction:med}); const {a}=ctx(); if(out) out.innerHTML=`Trials: ${T.times.join(', ')} ms. Median <b class="num">${med} ms</b> vs baseline ${fmt(a.baseline.reaction.mean,'reaction')} ms ${tag(statusFromZ(adverseZ('reaction',med,a.baseline.reaction)))} ${prov('user')}`; } } }
function memoryTest(){ const box=document.getElementById('mem-box'); const T=UI.test={kind:'mem',len:4,best:0}; const run=()=>{ const seq=Array.from({length:T.len},()=>Math.floor(Math.random()*10)); let i=0; box.innerHTML=`<div class="rt-pad wait" id="mem-show" style="font-size:30px;font-family:var(--mono)"></div><div class="small c-muted" style="margin-top:6px">Sequence length ${T.len}</div>`; const show=document.getElementById('mem-show'); const tick=()=>{ if(i<seq.length){ show.textContent=seq[i++]; setTimeout(()=>{ show.textContent=''; setTimeout(tick,250); },600); } else input(); }; tick();
    const input=()=>{ let ans=[]; box.innerHTML=`<div class="small c-muted" style="margin-bottom:6px">Enter the sequence</div><div class="num" id="mem-ans" style="min-height:20px;font-size:15px"></div><div class="mem-grid" style="margin-top:6px">${[1,2,3,4,5,6,7,8,9,0].map(n=>`<button class="btn" data-n="${n}">${n}</button>`).join('')}</div>`; box.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{ ans.push(+b.dataset.n); document.getElementById('mem-ans').textContent=ans.join(' '); if(ans.length===seq.length){ const ok=ans.every((v,k)=>v===seq[k]); if(ok){ T.best=T.len; if(T.len<7){ T.len++; setTimeout(run,500); return; } } finish(); } }); };
    const finish=()=>{ const score=+(T.best/7*10).toFixed(1); saveTest({memory:score}); const {a}=ctx(); box.innerHTML=`<p>Longest correct sequence: <b class="num">${T.best}</b> → score <b class="num">${score}/10</b> vs baseline ${fmt(a.baseline.memory.mean,'memory')} ${tag(statusFromZ(adverseZ('memory',score,a.baseline.memory)))} ${prov('user')}</p><button class="btn" data-action="memstart">Repeat</button>`; }; }; run(); }
function attentionTest(){ const box=document.getElementById('att-box'); const letters='ABCDEFGHJLMNPQRSTUVWXYZ'; const cells=Array.from({length:48},()=>Math.random()<.22?'K':letters[Math.floor(Math.random()*letters.length)]); const ks=cells.filter(c=>c==='K').length; let hits=0,false_=0,left=20; box.innerHTML=`<div class="row between small"><span>Targets found: <b id="att-h">0</b>/${ks}</span><span>Time <b id="att-t">20</b> s</span></div><div class="att-grid" style="margin-top:6px">${cells.map((c,i)=>`<button class="btn" data-i="${i}">${c}</button>`).join('')}</div>`;
  box.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{ if(b.disabled) return; b.disabled=true; if(cells[+b.dataset.i]==='K'){ hits++; b.classList.add('hit'); } else false_++; document.getElementById('att-h').textContent=hits; if(hits===ks) end(); });
  const iv=setInterval(()=>{ left--; const t=document.getElementById('att-t'); if(t) t.textContent=left; if(left<=0) end(); },1000);
  const end=()=>{ clearInterval(iv); const pct=Math.max(0,Math.round(100*(hits-false_)/ks)); saveTest({attention:pct}); box.innerHTML=`<p>Accuracy <b class="num">${pct}%</b> (${hits} of ${ks} targets, ${false_} false taps, ${20-left} s) ${prov('user')}</p><p class="sub">No pre-flight attention baseline is stored for this profile; results accumulate from today.</p><button class="btn" data-action="attstart">Repeat</button>`; }; }
function breathing(){ const el=document.getElementById('breath'); if(!el) return; const phases=[['in','Breathe in'],['in','Hold'],['out','Breathe out'],['out','Hold']]; let i=0, n=0; const step=()=>{ if(!document.getElementById('breath')||n>=30){ if(el) el.textContent='Complete'; return; } el.className='breath '+phases[i%4][0]; el.textContent=phases[i%4][1]; i++; n++; setTimeout(step,4000); }; step(); }

function replayBar(a,mission){ const base=baseMission(mission.id); const D=mission.currentDay; const live=D>=base.currentDay; const R=UI.replay; const start=Math.max(1,base.currentDay-Math.min(base.currentDay-1,60));

    ${note(live?'Rewind the mission to watch ASTRA detect the pattern as it emerged: every page recomputes from the data available on the chosen day, and detections are announced as they fire.':'You are viewing the mission as it stood on day '+D+'. Readings after this day are hidden from every analysis; nothing is predicted from them. Return to live to see today.')}

function detectionsBetween(a,d0,d1){ const mid=a.mission; const saved=UI.viewDay[mid]; const snap=d=>{ UI.viewDay[mid]=d; const pats={}; for(const p of detectPatterns(a)) pats[p.id]=p.title; const st={}; for(const m of METRIC_IDS){ const dv=deviation(a,m); st[m]={s:dv.status,v:dv.value}; } return {pats,st}; };
  const s0=snap(d0), s1=snap(d1); UI.viewDay[mid]=saved; const msgs=[];
  for(const id in s1.pats) if(!s0.pats[id]) msgs.push(`${s1.pats[id]} detected — assessments and countermeasures generated`);
  for(const m of METRIC_IDS){ const x=s0.st[m].s, y=s1.st[m].s; if(y!=='na'&&x!=='na'&&ORDER[y]>ORDER[x]&&ORDER[y]>=ORDER.att) msgs.push(`${METRICS[m].label} ${y==='att'?'drifting from':'outside'} baseline: ${fmt(s1.st[m].v,m)} ${METRICS[m].unit} vs ${fmt(a.baseline[m].mean,m)}`); }
  return msgs; }
function setViewDay(d,logDiff){ const {a,mission}=ctx(); const base=baseMission(mission.id); const prev=mission.currentDay; d=Math.max(1,Math.min(base.currentDay,d)); if(d===prev) return;
  if(logDiff){ const msgs=detectionsBetween(a,prev,d); for(const m of msgs) UI.replay.log.push({day:d,msg:m}); if(msgs.length&&UI.replay.playing) toast(`Day ${d} — ${msgs[0]}`); }
  UI.viewDay[base.id]=d>=base.currentDay?null:d; renderShell(); rerenderPageKeepScroll(); }
function replayStop(){ if(UI.replay.timer){ clearInterval(UI.replay.timer); UI.replay.timer=null; } UI.replay.playing=false; }
function replayPlay(){ const {mission}=ctx(); const base=baseMission(mission.id); if(mission.currentDay>=base.currentDay){ UI.replay.log=[]; UI.viewDay[base.id]=Math.max(1,base.currentDay-14); }
  UI.replay.playing=true; renderShell(); rerenderPageKeepScroll();
  UI.replay.timer=setInterval(()=>{ const {mission}=ctx(); const base=baseMission(mission.id); if(mission.currentDay>=base.currentDay){ replayStop(); renderShell(); rerenderPageKeepScroll(); toast('Replay complete — back to live, day '+base.currentDay); return; } setViewDay(mission.currentDay+1,true); },[0,800,420,210][UI.replay.speed]||800); }
ACTIONS.replayplay=()=>{ if(UI.replay.playing){ replayStop(); renderShell(); rerenderPageKeepScroll(); } else replayPlay(); };
ACTIONS.replaystep=el=>{ replayStop(); const {mission}=ctx(); setViewDay(mission.currentDay+(+el.dataset.d),true); };
ACTIONS.replaylive=()=>{ replayStop(); const {mission}=ctx(); UI.viewDay[mission.id]=null; UI.replay.log=[]; renderShell(); rerenderPageKeepScroll(); };
ACTIONS.replayspeed=el=>{ UI.replay.speed=+el.dataset.s; if(UI.replay.playing){ replayStop(); replayPlay(); } else rerenderPageKeepScroll(); };
INPUTS.replayday=el=>{ const lbl=document.getElementById('replay-day'); if(lbl) lbl.textContent='Day '+el.value; };
INPUT_CHANGE.replayday=el=>{ replayStop(); UI.replay.log=[]; setViewDay(+el.value,false); };

/* ---------- Guided tour ---------- */
const GUIDE=[

 {page:'dashboard',sel:'.nav',t:'Navigation',d:'Four groups follow the ASTRA workflow: Mission overview, Health monitoring (sense), Mission intelligence (understand and predict), Medical support (act and evaluate). The red badge counts active alerts.'},
 {page:'dashboard',sel:'.replay',t:'Mission replay',d:'Rewind the mission and press Play to watch ASTRA detect the developing pattern day by day. Every page recomputes from only the data that existed on that day, and each new detection is announced as it fires.'},
 {page:'dashboard',sel:'#page-dashboard .grid.g4',t:'Headline indicators',d:'Large figures are today’s values compared with this crew member’s own pre-flight baseline. The coloured rule beneath each is its status; grey means no data. Every value carries a provenance label: SIMULATED, USER INPUT, DERIVED or PREDICTED.'},
 {page:'dashboard',sel:'.bodymap',t:'Interactive body map',d:'Ten body systems coloured by their worst indicator. Click any region to see anatomy, live status, history, risks and recommended actions for that system.'},

 {page:'scan',sel:'#page-scan',t:'Daily health scan',d:'Enter what you measured today. Entries are validated, saved as USER INPUT and immediately re-run through every analysis. The adaptive panel on the right tells you which extra checks matter today.'},

 {page:'hazards',sel:'.radar',t:'Five-hazard risk radar',d:'The outer ring holds NASA’s five spaceflight hazards; the inner ring holds your body systems. Line thickness is the strength of the documented relationship; node colour is the crew’s worst current status. Select either ring to explore it.'},

 {page:'system',sel:'#page-system',t:'Data provenance and controls',d:'Historical mission dates and official crew rosters are shown where sourced; all health profiles, measurements and scenario events are synthetic. Here you can reset the demonstration, copy your data, manage privacy and read the reference list. You can reopen this guide any time from the Guide me button.'}
